<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#13283b">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <title>ToolControl — Enlace desactivado</title>
  <style>
    :root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#10273a;color:#fff}
    body{min-height:100svh;display:grid;place-items:center;padding:28px 18px}
    main{width:min(100%,850px);border:2px solid #f9acac;background:#1b344a;border-radius:24px;padding:clamp(28px,7vw,64px) clamp(18px,6vw,56px);text-align:center;box-shadow:0 18px 60px #0007}
    .symbol{font-size:clamp(54px,12vw,95px);line-height:1.15;margin-bottom:18px}
    h1{margin:0;font-size:clamp(35px,7vw,72px);font-weight:900;line-height:1.12;letter-spacing:-.035em;color:#fff;text-wrap:balance}
    .mark{color:#ffb4b4}
    p{margin:28px auto 0;max-width:570px;font-size:clamp(17px,3vw,23px);line-height:1.5;color:#e1ebf2}
  </style>
</head>
<body>
  <main role="alert" aria-live="assertive">
    <div class="symbol" aria-hidden="true">⛔</div>
    <h1><span class="mark">LINK FUE DESACTIVADO</span><br>POR SU CREADOR</h1>
    <p>El acceso a ToolControl para iPhone ya no está disponible.</p>
  </main>
  <script>
    // Solicita la actualización del Service Worker previo para sustituir las pantallas en caché.
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        for (const registration of registrations) registration.update().catch(() => {});
      }).catch(() => {});
    }
  </script>
</body>
</html>
