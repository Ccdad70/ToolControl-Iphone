<script>
// ToolControl iPhone 2.1: alternate QR / 1D scanning engine for Safari (ZXing JS).
let tcZxingLoadPromise = null;
function tcLoadZxing(){
  if(window.ZXing && window.ZXing.BrowserMultiFormatReader) return Promise.resolve(true);
  if(tcZxingLoadPromise) return tcZxingLoadPromise;
  tcZxingLoadPromise = new Promise(resolve=>{
    const script=document.createElement('script');
    script.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
    script.async=true;
    script.onload=()=>resolve(!!window.ZXing?.BrowserMultiFormatReader);
    script.onerror=()=>resolve(false);
    document.head.appendChild(script);
  });
  return tcZxingLoadPromise;
}
// Called only after we have a playing video and a camera stream.
function tcStartZxing(video,onDecoded){
  if(!window.ZXing?.BrowserMultiFormatReader)return false;
  const reader=new window.ZXing.BrowserMultiFormatReader(undefined,350);
  scanReader=reader;
  reader.decodeContinuously(video,(result)=>{
    if(!result || scanReader!==reader) return;
    const value=String(result.getText?.()||'').trim();
    if(value)onDecoded(value);
  });
  return true;
}
// iOS must request user consent for each SMS via Apple's Messages composer.
function tcOpenIOSMessage(id){
  const p=person(id);
  if(!p || !p.smsConsent || !isPhoneNumber(p.phone))return toast('Este trabajador no tiene SMS autorizados.');
  const phone=String(p.phone).replace(/[^0-9+]/g,'');
  const text=smsText(p);
  const copy=()=>{if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).catch(()=>{});};
  copy();
  window.location.href='sms:'+phone+'&body='+encodeURIComponent(text);
  toast('Se abrirá Mensajes. Revisa y confirma el envío manualmente.');
}
</script>

		for (var r = -1; r <= 7; r++) {
			
			if (row + r <= -1 || this.moduleCount <= row + r) continue;
			
			for (var c = -1; c <= 7; c++) {
				
				if (col + c <= -1 || this.moduleCount <= col + c) continue;
				
				if ( (0 <= r && r <= 6 && (c === 0 || c === 6) ) || 
                     (0 <= c && c <= 6 && (r === 0 || r === 6) ) || 
                     (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
					this.modules[row + r][col + c] = true;
				} else {
					this.modules[row + r][col + c] = false;

			}		
		}		
	},
	
	getBestMaskPattern : function() {
	
		var minLostPoint = 0;
		var pattern = 0;
	
		for (var i = 0; i < 8; i++) {
			
			this.makeImpl(true, i);
	
			var lostPoint = QRUtil.getLostPoint(this);
	
			if (i === 0 || minLostPoint >  lostPoint) {
				minLostPoint = lostPoint;
				pattern = i;
			}
		}
	
		return pattern;
	},
	
	createMovieClip : function(target_mc, instance_name, depth) {
	
		var qr_mc = target_mc.createEmptyMovieClip(instance_name, depth);
		var cs = 1;
	
		this.make();

		for (var row = 0; row < this.modules.length; row++) {
			
			var y = row * cs;
			
			for (var col = 0; col < this.modules[row].length; col++) {
	
				var x = col * cs;
				var dark = this.modules[row][col];
			
				if (dark) {
					qr_mc.beginFill(0, 100);
					qr_mc.moveTo(x, y);
					qr_mc.lineTo(x + cs, y);
					qr_mc.lineTo(x + cs, y + cs);
					qr_mc.lineTo(x, y + cs);
					qr_mc.endFill();
				}
			}
		}
		
		return qr_mc;
	},

	setupTimingPattern : function() {
		
		for (var r = 8; r < this.moduleCount - 8; r++) {
			if (this.modules[r][6] !== null) {
				continue;
			}
			this.modules[r][6] = (r % 2 === 0);
		}
	
		for (var c = 8; c < this.moduleCount - 8; c++) {
			if (this.modules[6][c] !== null) {
				continue;
			}
			this.modules[6][c] = (c % 2 === 0);
		}

		for (var i = 0; i < pos.length; i++) {
		
			for (var j = 0; j < pos.length; j++) {
			
				var row = pos[i];
				var col = pos[j];
				
				if (this.modules[row][col] !== null) {
					continue;
				}
				
				for (var r = -2; r <= 2; r++) {
				
					for (var c = -2; c <= 2; c++) {
					
						if (Math.abs(r) === 2 || 
                            Math.abs(c) === 2 ||
                            (r === 0 && c === 0) ) {
							this.modules[row + r][col + c] = true;
						} else {
							this.modules[row + r][col + c] = false;

					}
				}
			}
		}
	},
	
	setupTypeNumber : function(test) {
	
		var bits = QRUtil.getBCHTypeNumber(this.typeNumber);
        var mod;
	
		for (var i = 0; i < 18; i++) {
			mod = (!test && ( (bits >> i) & 1) === 1);

		}
	
		for (var x = 0; x < 18; x++) {
			mod = (!test && ( (bits >> x) & 1) === 1);

			mod = (!test && ( (bits >> v) & 1) === 1);
	
			if (v < 6) {
				this.modules[v][8] = mod;
			} else if (v < 8) {
				this.modules[v + 1][8] = mod;
			} else {
				this.modules[this.moduleCount - 15 + v][8] = mod;
			}
		}
	
		// horizontal
		for (var h = 0; h < 15; h++) {
	
			mod = (!test && ( (bits >> h) & 1) === 1);
			
			if (h < 8) {
				this.modules[8][this.moduleCount - h - 1] = mod;
			} else if (h < 9) {

			} else {
				this.modules[8][15 - h - 1] = mod;
			}
		}

		this.modules[this.moduleCount - 8][8] = (!test);

		var row = this.moduleCount - 1;
		var bitIndex = 7;
		var byteIndex = 0;
		
		for (var col = this.moduleCount - 1; col > 0; col -= 2) {
	
			if (col === 6) col--;
	
			while (true) {
	
				for (var c = 0; c < 2; c++) {
					
					if (this.modules[row][col - c] === null) {
						
						var dark = false;

							dark = ( ( (data[byteIndex] >>> bitIndex) & 1) === 1);
						}

						if (mask) {
							dark = !dark;
						}
						
						this.modules[row][col - c] = dark;
						bitIndex--;
	
						if (bitIndex === -1) {
							byteIndex++;
							bitIndex = 7;
						}
					}
				}
								
				row += inc;
	
				if (row < 0 || this.moduleCount <= row) {
					row -= inc;
					inc = -inc;
					break;
				}
			}
		}
		
	}

};

QRCode.PAD0 = 0xEC;
QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	// calc num max data.
	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

module.exports = QRCode;

let scanAudio=null;
function prepareScanAudio(){
  if(window.AppBridge?.scanFeedback)return; // La APK emite el beep nativo.
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;
    if(!Ctx)return;
    if(!scanAudio)scanAudio=new Ctx();
    if(scanAudio.state==='suspended')scanAudio.resume().catch(()=>{});
  }catch(e){}
}
function playScanBeep(){
  try{
    if(window.AppBridge?.scanFeedback)return;
    prepareScanAudio();
    if(!scanAudio || scanAudio.state!=='running')return;
    const oscillator=scanAudio.createOscillator();
    const gain=scanAudio.createGain();
    const start=scanAudio.currentTime;
    oscillator.type='sine';
    oscillator.frequency.setValueAtTime(1050,start);
    gain.gain.setValueAtTime(0.0001,start);
    gain.gain.exponentialRampToValueAtTime(0.21,start+0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001,start+0.105);
    oscillator.connect(gain);gain.connect(scanAudio.destination);
    oscillator.start(start);oscillator.stop(start+0.11);
  }catch(e){}
}

function toolForm(t){t=t||{};return `<form id="toolForm" onsubmit="saveTool(event)"><div class="card"><div class="field"><label>Nombre de herramienta *</label><input id="toolName" maxlength="100" required placeholder="Ej.: Taladro DeWalt 20V" value="${esc(t.name||'')}"></div><div class="field"><label>Código de barras o QR</label><div class="inputscan"><input id="toolCode" maxlength="90" placeholder="Escanear o dejar vacío (autogenerar)" value="${esc(t.code||'')}"><button type="button" onclick="scanTo('toolCode')" title="Escanear código">▣</button></div><small>Si la herramienta no tiene código, generaremos uno exclusivo.</small></div><div class="two"><div class="field"><label>Marca</label><input id="toolBrand" maxlength="75" placeholder="DeWalt" value="${esc(t.brand||'')}"></div><div class="field"><label>Modelo/serie</label><input id="toolSerial" maxlength="100" placeholder="Modelo o serial" value="${esc(t.serial||'')}"></div></div><div class="field"><label>Foto de herramienta</label><div class="photo" id="photoPreview">${t.photo?`<img src="${t.photo}" alt="Herramienta">`:'📷<br>Toca el botón para tomar una foto'}</div><div class="btnrow"><label class="btn secondary" style="text-align:center;display:block;cursor:pointer">📷 Tomar o elegir foto<input id="toolPhoto" type="file" accept="image/*" capture="environment" hidden onchange="photoPicked(this)"></label></div></div><button type="submit" class="btn primary block">✓ Guardar herramienta</button></div></form>`}
function nextCode(){let n=Math.max(0,...state.tools.map(t=>{const m=String(t.code).match(/^TC-(\d+)$/);return m?+m[1]:0}));let c;do{c='TC-'+String(++n).padStart(5,'0')}while(toolByCode(c));return c}
async function saveTool(ev){ev.preventDefault();const name=$('toolName').value.trim(), code=($('toolCode').value.trim()||(!editId?nextCode():state.tools.find(x=>x.id===editId)?.code)||'').trim();if(!name||!code)return toast('Escribe el nombre.');if(state.tools.some(x=>x.code.toLowerCase()===code.toLowerCase()&&x.id!==editId))return toast('Ese código ya corresponde a otra herramienta.');let t=editId?state.tools.find(x=>x.id===editId):null;if(!t){t={id:newId(),status:'available',personId:null,assignedAt:null,due:'',notes:''};state.tools.push(t);logMove('registro',t,null,'Herramienta registrada')}Object.assign(t,{name,code,brand:$('toolBrand').value.trim(),serial:$('toolSerial').value.trim(),photo:photoData||t.photo||''});if(!await save())return toast('No se pudo guardar. Revisa la conexión o el conflicto.');go('inventory');toast('Herramienta guardada correctamente')}
function photoPicked(input){const file=input.files?.[0];if(!file)return;if(file.size>20*1024*1024)return toast('Selecciona una imagen de hasta 20 MB.');const img=new Image(), url=URL.createObjectURL(file);img.onload=()=>{const scale=Math.min(1,780/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(img.width*scale));cv.height=Math.max(1,Math.round(img.height*scale));cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);photoData=cv.toDataURL('image/jpeg',.66);$('photoPreview').innerHTML=`<img src="${photoData}" alt="Foto de la herramienta">`;URL.revokeObjectURL(url)};img.onerror=()=>toast('No se pudo leer la foto');img.src=url}
function assignView(){return `<div class="card"><div class="field"><label>1. ¿Quién recibe las herramientas?</label><div class="inputscan"><select id="assignPerson" onchange="startContinuousSession()"><option value="">Seleccionar trabajador</option>${state.people.map(p=>`<option value="${p.id}">${esc(p.name)}${p.code?' · '+esc(p.code):''}</option>`).join('')}</select><button onclick="scanPerson()" title="Escanear QR del trabajador" type="button">▣</button></div>${!state.people.length?'<small>Registra primero al trabajador desde Personal.</small>':''}</div><div class="field"><label>2. Fecha de devolución (opcional)</label><input id="assignDue" type="date" value="${esc(defaultDue())}"><small>La alerta se activa a las 5:00 p. m. de ese día.</small></div><button class="btn primary block" onclick="startContinuousSession()" ${!state.people.length?'disabled':''}>📷 Abrir cámara / reintentar</button><p class="hint">🔊 Un beep confirma cada herramienta asignada. Al seleccionar un trabajador, se intentará abrir la cámara automáticamente. Si el teléfono solicita permiso, selecciona «Permitir». Apunta la cámara a cada código QR o de barras. Cada herramienta disponible queda asignada y guardada inmediatamente, sin pulsar «Agregar».</p></div><div class="card"><h3 style="margin:0 0 7px">Última entrega</h3><p id="lastDelivery" class="hint">Selecciona un trabajador y comienza a escanear.</p><div class="field"><label>Agregar código manualmente (alternativa)</label><div class="inputscan"><input id="assignManual" placeholder="Código de la herramienta" onkeydown="if(event.key==='Enter'){event.preventDefault();addManualAssignment()}"><button type="button" title="Asignar manualmente" onclick="addManualAssignment()">+</button></div></div></div>`}
function defaultDue(){let dt=new Date();if(dt.getHours()>=17)dt.setDate(dt.getDate()+1);return [dt.getFullYear(),String(dt.getMonth()+1).padStart(2,'0'),String(dt.getDate()).padStart(2,'0')].join('-')}
function scanPerson(){scanDone=code=>{const p=state.people.find(x=>(x.code&&x.code.toUpperCase()===code.toUpperCase())||('EMP-'+x.id.slice(0,8)).toUpperCase()===code.toUpperCase());if(!p)return toast('No se encontró un trabajador con ese QR.');$('assignPerson').value=p.id;toast('Seleccionado: '+p.name)};if(window.AppBridge&&AppBridge.scanCode)AppBridge.scanCode();else openBrowserScanner()}
function scanResult(message,kind='error'){
  if(continuousSession?.active){
    const el=$('continuousStatus');if(el){el.textContent=message;el.className='scan-status '+kind}
    if($('continuousCount'))$('continuousCount').textContent=continuousSession.count;
    if(window.AppBridge?.scanFeedback)AppBridge.scanFeedback(message,kind,continuousSession.count);
    else if(kind==='ok')playScanBeep();
  }else{toast(message)}
}
async function assignScannedCode(value,session){
  if(!session)return;
  const code=String(value||'').trim();if(!code)return;
  const t=toolByCode(code);
  if(!t){scanResult('Código no registrado: '+code,'error');return}
  if(t.status!=='available'){
    const sameSession=session.savedIds.has(t.id);
    scanResult(sameSession?'Ya escaneada: '+t.name:t.status==='assigned'?'No disponible: la tiene '+(person(t.personId)?.name||'otro trabajador'):'No disponible: '+t.name,sameSession?'duplicate':'error');return;
  }
  const p=person(session.personId);
  if(!p){scanResult('El trabajador ya no existe. Finaliza y vuelve a seleccionar.','error');return}
  const before={status:t.status,personId:t.personId,assignedAt:t.assignedAt,due:t.due};
  Object.assign(t,{status:'assigned',personId:p.id,assignedAt:now(),due:session.due});
  logMove('entrega',t,p,session.due?'Devolver '+dateText(session.due):'Sin fecha límite');
  const newHistoryId=state.history[0]?.id;
  const ok=await save();
  if(!ok){Object.assign(t,before);state.history=state.history.filter(h=>h.id!==newHistoryId);continuousCodeTimes.delete(code);if(window.AppBridge?.releaseContinuousCode)AppBridge.releaseContinuousCode(code);scanResult('No se guardó la entrega. Repite el escaneo.','error');return}
  session.count++;session.savedIds.add(t.id);session.last=t.name;
  scanResult('✓ Asignada: '+t.name,'ok');
  if($('lastDelivery'))$('lastDelivery').textContent=session.count+' herramientas a '+p.name+' · última: '+t.name;
}
function receiveContinuousCode(code){
  const session=continuousSession;
  if(!session?.active)return;
  const cleaned=String(code||'').trim();if(!cleaned)return;
  // Serializa guardados: dos códigos seguidos no pueden pisarse durante una escritura IndexedDB.
  continuousPromise=continuousPromise.then(()=>session.mode==='return'?returnScannedCode(cleaned,session):assignScannedCode(cleaned,session)).catch(err=>scanResult('Error al procesar: '+err.message,'error'));
}
window.receiveContinuousScan=receiveContinuousCode;
async function addManualAssignment(){
  const chosen=person($('assignPerson')?.value);
  if(!chosen)return toast('Primero selecciona un trabajador.');
  if(continuousSession?.active)return toast('Finaliza el escaneo continuo primero.');
  const input=$('assignManual'),code=input?.value.trim();if(!code)return toast('Escribe el código.');
  const session={personId:chosen.id,due:$('assignDue')?.value||'',count:0,savedIds:new Set(),last:'',active:false};
  await assignScannedCode(code,session);
  if(session.count){input.value='';$('lastDelivery').textContent='✓ '+session.last+' asignada a '+chosen.name;toast('Herramienta asignada: '+session.last)}
}
function startContinuousSession(){
  prepareScanAudio();
  if(continuousSession?.active)return;
  const p=person($('assignPerson')?.value);
  if(!p)return toast('Selecciona primero al trabajador.');
  const due=$('assignDue')?.value||'';
  continuousSession={mode:'assign',personId:p.id,personName:p.name,due,count:0,savedIds:new Set(),last:'',active:true};
  continuousPromise=Promise.resolve();continuousCodeTimes.clear();
  if(window.AppBridge?.startContinuousScan){AppBridge.startContinuousScan(p.name,'assign');return}
  openContinuousBrowserScanner();
}
function stopContinuousSession(showSummary=true){
  const session=continuousSession;
  if(!session)return;
  session.active=false;
  if(window.AppBridge?.stopContinuousScan)AppBridge.stopContinuousScan();
  closeScan();
  continuousSession=null;
  continuousPromise.then(()=>{
    if(showSummary){
      const txt=session.count+' herramienta'+(session.count===1?'':'s')+(session.mode==='return'?' recibida':' asignada')+(session.count===1?'':'s')+' de '+session.personName+'.';
      if(session.mode==='return'){if($('returnLast'))$('returnLast').textContent=txt;refreshReturnPending()}else if($('lastDelivery'))$('lastDelivery').textContent=txt;
      toast(txt);
    }
  });
}
window.finishContinuousScan=()=>stopContinuousSession(true);
window.nativeContinuousScanError=msg=>{stopContinuousSession(false);toast(msg||'No se pudo iniciar la cámara. Puedes introducir el código manualmente.')};
function explainCameraFailure(error){
  const name=error?.name||'';
  if(name==='NotAllowedError'||name==='PermissionDeniedError'||name==='SecurityError')return 'Acceso a la cámara bloqueado. En Chrome, permite el uso de la cámara en los permisos del sitio. Si abriste el HTML dentro de ChatGPT o desde Archivos, utiliza una versión instalada o un sitio HTTPS.';
  if(name==='NotFoundError'||name==='DevicesNotFoundError')return 'No se detectó ninguna cámara disponible en este dispositivo.';
  if(name==='NotReadableError'||name==='TrackStartError')return 'La cámara está ocupada por otra aplicación. Ciérrala e inténtalo otra vez.';
  if(name==='OverconstrainedError')return 'No se encontró una cámara compatible. Inténtalo sin exigir la cámara trasera.';
  return 'No se pudo abrir la cámara'+(name?' ('+name+')':'')+'. Prueba en Chrome desde un sitio HTTPS o usa la aplicación Android instalada.';
}
function manualContinuousSubmit(){
  const i=$('continuousManual');
  const code=i?.value.trim();
  if(!code || !continuousSession?.active)return;
  i.value='';
  receiveContinuousCode(code);
}
async function openContinuousBrowserScanner(){
  closeScan();
  if(!continuousSession?.active)return;
  const d=document.createElement('div');d.id='scanModal';d.className='sheetbg scanfullscreen';
  d.innerHTML=`<div class="sheet"><div class="sheet-title"><h2>${continuousSession.mode==='return'?'Recepción continua':'Entrega continua'} 🔊</h2><button class="x" onclick="finishContinuousScan()" aria-label="Finalizar">×</button></div><p class="hint">Trabajador: <b>${esc(continuousSession.personName)}</b></p><video id="scanVideo" autoplay playsinline muted></video><p class="scan-status" id="continuousStatus" role="status">Solicitando acceso a la cámara…</p><div class="scan-counter"><b id="continuousCount">0</b> herramientas ${continuousSession.mode==='return'?'recibidas':'asignadas'}</div><div class="field"><label>Ingresar código manualmente (alternativa)</label><div class="inputscan"><input id="continuousManual" placeholder="Código de herramienta" onkeydown="if(event.key==='Enter'){event.preventDefault();manualContinuousSubmit()}"><button type="button" onclick="manualContinuousSubmit()">+</button></div></div><button class="btn primary block" onclick="finishContinuousScan()">✓ Finalizar ${continuousSession.mode==='return'?'recepción':'entrega'}</button></div>`;
  document.body.appendChild(d);
  if(!navigator.mediaDevices?.getUserMedia){
    scanResult('Este navegador no permite acceder a la cámara desde aquí. Abre ToolControl en Chrome mediante HTTPS o usa la app Android instalada. También puedes introducir códigos manualmente.','error');
    return;
  }
  try{
    // Intentar abrir la cámara siempre, aunque la API BarcodeDetector no esté disponible.
    // Antes se comprobaba BarcodeDetector primero y se omitía por completo el acceso a la cámara.
    scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    const video=$('scanVideo');if(!video||!continuousSession?.active)return closeScan();
    video.srcObject=scanStream;
    await video.play();
    if(typeof BarcodeDetector==='undefined'){
      scanResult('Preparando lector QR y código de barras compatible con iPhone…','');
      if(await tcLoadZxing()){
        if(!continuousSession?.active || !$('scanVideo'))return closeScan();
        tcStartZxing(video, code=>{
          if(!continuousSession?.active)return;
          // Allow a re-read after the cooldown; original per-session duplicate validation still applies.
          const at=Date.now(),last=continuousCodeTimes.get(code)||0;
          if(at-last<1200)return;
          continuousCodeTimes.set(code,at);
          receiveContinuousCode(code);
        });
        scanResult('Lector iPhone listo: apunta a QR o código de barras.','');
      }else{
        scanResult('No se pudo cargar el lector. Revisa tu internet o escribe el código manualmente.','error');
      }
      return;
    }
    const preferred=['qr_code','code_128','code_39','ean_13','ean_8','upc_a','upc_e','itf','codabar','data_matrix','pdf417'];
    let formats=preferred;
    if(typeof BarcodeDetector.getSupportedFormats==='function'){
      try{const supported=await BarcodeDetector.getSupportedFormats();formats=preferred.filter(f=>supported.includes(f));}catch(e){}
    }
    try{scanReader=formats.length?new BarcodeDetector({formats}):new BarcodeDetector()}
    catch(err){scanReader=new BarcodeDetector()}
    scanResult('Cámara lista: enfoca un código de barras o QR. La lectura se verificará automáticamente.','');
    let detecting=false;
    const scanFrame=async()=>{
      const v=$('scanVideo');if(!v||!scanReader||!continuousSession?.active)return;
      if(!detecting&&v.readyState>=2){
        detecting=true;
        try{
          const codes=await scanReader.detect(v);
          for(const barcode of codes){
            const code=barcode.rawValue?.trim();if(!code)continue;
            if(!continuousCodeTimes.has(code)){continuousCodeTimes.set(code,Date.now());receiveContinuousCode(code);break}
          }
        }catch(e){}
        detecting=false;
      }
      scanTimer=requestAnimationFrame(scanFrame);
    };
    scanFrame();
  }catch(e){scanResult(explainCameraFailure(e),'error');}
}

 const selected=state.people.find(p=>p.id===returnSelectedWorker);

 return `<div class="card"><h3>↙ Recibir herramientas</h3><p class="hint">Selecciona al trabajador. Solo se aceptarán los códigos únicos de las herramientas que están actualmente bajo su responsabilidad.</p>
 <div class="field"><label>Estado de las herramientas que vas a escanear</label><select id="returnCondition"><option value="available">✅ En buen estado</option><option value="damaged">⚠️ Dañadas</option></select><small>Para recibir una herramienta dañada, elige «Dañadas» antes de comenzar.</small></div>

 <button class="btn primary block" onclick="startReturnContinuousSession()" ${!state.people.length?'disabled':''}>📷 Iniciar / reintentar recepción</button>
 <p class="hint">La cámara continuará leyendo hasta que pulses «Finalizar recepción». BEEP solamente cuando se registre un código válido de este trabajador.</p>

 <div class="field"><label>Código manual (alternativa)</label><div class="inputscan"><input id="returnManual" placeholder="Ej.: TOOL-004" onkeydown="if(event.key==='Enter'){event.preventDefault();addManualReturn()}"><button type="button" onclick="addManualReturn()">+</button></div></div>

let returnSelectedWorker='';
function returnPendingHtml(id){const items=state.tools.filter(t=>t.status==='assigned'&&t.personId===id);return items.length?`<div class="person-pending"><h3>Por devolver (${items.length})</h3>${items.map(t=>`<div class="item"><div class="item-main"><strong>${esc(t.name)}</strong><small>${esc(t.code)}</small></div><span class="status assigned">Pendiente</span></div>`).join('')}</div>`:'<div class="inline-notice">✓ Este trabajador no tiene herramientas pendientes.</div>'}
function refreshReturnPending(){const list=$('returnPendingList');if(list&&returnSelectedWorker)list.innerHTML=returnPendingHtml(returnSelectedWorker)}
function startReturnContinuousSession(){
 prepareScanAudio();if(continuousSession?.active)return;
 const p=person($('returnPerson')?.value);
 if(!p)return toast('Primero selecciona al trabajador.');
 returnSelectedWorker=p.id;
 const count=state.tools.filter(t=>t.status==='assigned'&&t.personId===p.id).length;
 if(!count)return toast('Este trabajador no tiene herramientas pendientes por devolver.');
 const condition=$('returnCondition')?.value||'available';
 continuousSession={mode:'return',personId:p.id,personName:p.name,condition,count:0,savedIds:new Set(),last:'',active:true};
 continuousPromise=Promise.resolve();continuousCodeTimes.clear();
 if(window.AppBridge?.startContinuousScan){AppBridge.startContinuousScan(p.name,'return');return}
 openContinuousBrowserScanner();
}
async function returnScannedCode(value,session){
 if(!session)return;
 const code=String(value||'').trim();if(!code)return;
 const t=toolByCode(code);
 if(!t){scanResult('Código rechazado: '+code+' no está registrado.','error');return}
 if(session.savedIds.has(t.id)){scanResult('Ya recibida en esta sesión: '+t.name,'duplicate');return}
 if(t.status!=='assigned'||t.personId!==session.personId){
   const owner=person(t.personId)?.name;
   scanResult(t.status==='assigned'?'RECHAZADA: '+t.name+' pertenece a '+(owner||'otro trabajador'):'RECHAZADA: '+t.name+' no está asignada a este trabajador.','error');return;
 }
 const p=person(session.personId);
 if(!p){scanResult('El trabajador no existe. Finaliza y vuelve a comenzar.','error');return}
 const before={status:t.status,personId:t.personId,assignedAt:t.assignedAt,due:t.due};
 const condition=session.condition==='damaged'?'damaged':'available';
 logMove(condition==='damaged'?'daño':'devolución',t,p,condition==='damaged'?'Devuelta con daño registrado':'Recepción validada por código y trabajador');
 const hId=state.history[0]?.id;
 Object.assign(t,{status:condition,personId:null,assignedAt:null,due:''});
 const ok=await save();
 if(!ok){Object.assign(t,before);state.history=state.history.filter(h=>h.id!==hId);continuousCodeTimes.delete(code);if(window.AppBridge?.releaseContinuousCode)AppBridge.releaseContinuousCode(code);scanResult('No se confirmó la devolución; intenta de nuevo.','error');return}
 session.savedIds.add(t.id);session.count++;session.last=t.name;
 scanResult('✓ Recibida: '+t.name+' ('+t.code+')','ok');
 refreshReturnPending();
 if($('returnLast'))$('returnLast').textContent='Recibidas: '+session.count+' · última: '+t.name;
}
async function addManualReturn(){
 const p=person($('returnPerson')?.value);if(!p)return toast('Selecciona al trabajador.');
 if(continuousSession?.active)return toast('Finaliza la recepción continua para introducir un código manual.');
 const input=$('returnManual');const code=input?.value.trim();if(!code)return toast('Introduce el código.');
 const session={mode:'return',personId:p.id,personName:p.name,condition:$('returnCondition')?.value||'available',count:0,savedIds:new Set(),active:false};
 await returnScannedCode(code,session);
 if(session.count){input.value='';refreshReturnPending();toast('Recepción confirmada: '+session.last)}
}

async function markDamaged(id){
 const t=state.tools.find(x=>x.id===id);
 if(!t)return toast('No se encontró la herramienta');
 if(t.status!=='available')return toast('Solo puedes marcar dañada una herramienta disponible. Si está asignada, primero regístrala como devuelta con daño.');
 const msg=prompt('¿Qué daño presenta «'+t.name+'»? (opcional, máximo 300 caracteres)','');
 if(msg===null)return;
 if(!confirm('¿Marcar como DAÑADA la herramienta '+t.code+'? No podrá entregarse hasta su reparación.'))return;
 const previous=JSON.parse(JSON.stringify(state));
 t.status='damaged';t.damagedAt=now();t.damageReason=String(msg).trim().slice(0,300);
 logMove('daño',t,null,t.damageReason||'Herramienta reportada como dañada');
 if(!await save()){state=previous;render();return toast('No se pudo confirmar el reporte. Comprueba la conexión.');}
 closeModal();render();toast('Herramienta movida a Dañadas');
}
async function markRepaired(id){
 const t=state.tools.find(x=>x.id===id);
 if(!t||!['damaged','lost'].includes(t.status))return toast('La herramienta no se puede reparar desde este estado');
 if(!confirm('¿Confirmas que «'+t.name+'» ya se encuentra en buen estado y puede volver a entregarse?'))return;
 const previous=JSON.parse(JSON.stringify(state));
 t.status='available';t.repairedAt=now();
 logMove('reparación',t,null,'Reparación comprobada; herramienta disponible nuevamente');
 if(!await save()){state=previous;render();return toast('No se confirmó la reparación.');}
 closeModal();render();toast('Herramienta reparada y disponible');
}
async function retireDamaged(id){
 const t=state.tools.find(x=>x.id===id);
 if(!t||t.status!=='damaged')return toast('Solo pueden retirarse por reemplazo herramientas dañadas');
 const replacement=prompt('Código o descripción de la herramienta de reemplazo (opcional):','');
 if(replacement===null)return;
 if(!confirm('¿Retirar «'+t.name+'» ('+t.code+') del inventario activo por reemplazo? Se conservará su registro y el historial.'))return;
 const previous=JSON.parse(JSON.stringify(state));
 t.status='retired';t.retiredAt=now();t.retiredReplacement=String(replacement).trim().slice(0,160);
 logMove('baja por reemplazo',t,null,t.retiredReplacement?'Reemplazada por '+t.retiredReplacement:'Retirada del inventario activo por reemplazo');
 if(!await save()){state=previous;render();return toast('No se confirmó la baja de la herramienta.');}
 closeModal();toolFilter='damaged';go('inventory');toast('Herramienta retirada; su historial permanece guardado');
}
async function deleteRetiredTool(id){
 const t=state.tools.find(x=>x.id===id);
 if(!t || t.status!=='retired')return toast('Solo puedes eliminar herramientas de Retiradas');
 if(!confirm('¿ELIMINAR DEFINITIVAMENTE «'+t.name+'» ('+t.code+') del inventario?\n\nDesaparecerá de Retiradas en los celulares conectados. No podrá recuperarse como herramienta. Su historial de movimientos se conservará.'))return;
 if(tcCloudOn){
  if(!navigator.onLine || !tcReady)return toast('Para eliminar una herramienta compartida necesitas conexión a Internet');
  if(tcOps.length){
   if(!await tcFlush() || tcOps.length)return toast('Sincroniza los movimientos pendientes antes de eliminar esta herramienta');
  }
  try{
   const {error}=await tcClient.rpc('tc_delete_retired_tool',{p_workspace:tcWorkspace,p_tool_id:id});
   if(error)throw error;
   // Este cambio ya se registró en la nube en una transacción segura.
   // Recargar actualiza también el historial con el administrador responsable.
   const refreshed=await tcRefresh();
   if(!refreshed){
    state.tools=state.tools.filter(x=>x.id!==id);
    tcRemote.tools=tcRemote.tools.filter(x=>x.id!==id);
    tcSaved.tools=tcSaved.tools.filter(x=>x.id!==id);
   }
   closeModal();toolFilter='retired';go('inventory');
   toast('Herramienta eliminada; historial conservado');
  }catch(e){toast('No se pudo eliminar: '+tcTextError(e));}
  return;
 }
 const previous=JSON.parse(JSON.stringify(state));
 logMove('eliminación',t,null,'Eliminada definitivamente de Retiradas (código: '+t.code+'). Historial conservado.');
 state.tools=state.tools.filter(x=>x.id!==id);
 if(!await save()){
  state=previous;render();return toast('No se confirmó la eliminación.');
 }
 closeModal();toolFilter='retired';go('inventory');toast('Herramienta eliminada; historial conservado');
}

async function savePerson(ev,id){ev.preventDefault();const name=$('personName').value.trim();if(!name)return;const empCode=$('personCode').value.trim();if(empCode&&state.people.some(x=>x.id!==id&&x.code&&x.code.toLowerCase()===empCode.toLowerCase()))return toast('Ese número de empleado ya existe.');const phone=$('personPhone').value.trim();if(phone&&!isPhoneNumber(phone))return toast('Número inválido. Usa 10 a 15 dígitos y código de país.');const smsConsent=$('personSmsConsent').checked;let p=id?person(id):null;if(p){Object.assign(p,{name,code:$('personCode').value.trim(),company:$('personCompany').value.trim(),phone,smsConsent})}else{p={id:newId(),name,code:$('personCode').value.trim(),company:$('personCompany').value.trim(),phone,smsConsent};state.people.push(p)}if(!await save())return toast('No se confirmó el registro del trabajador.');closeModal();render();toast('Trabajador guardado')}

function makeQR(value){try{const q=new QRCode(0,1);q.addData(value);q.make();const n=q.getModuleCount();let html=`<div class="qrgrid" style="--n:${n}" aria-label="QR de ${esc(value)}">`;for(let row=0;row<n;row++)for(let col=0;col<n;col++)html+=`<span class="qrcell" style="background:${q.isDark(row,col)?'#101e2c':'#fff'}"></span>`;return html+'</div>'}catch(e){return '<p>No se pudo generar el código QR.</p>'}}

async function restoreJSON(file){if(!file)return;try{const raw=JSON.parse(await file.text());if(raw.format!=='toolcontrol-v1'||!raw.data||!Array.isArray(raw.data.tools)||!Array.isArray(raw.data.people)||!Array.isArray(raw.data.history))throw Error('Archivo de copia inválido');if(!confirm('¿Restaurar esta copia? Reemplazará el inventario y los movimientos actuales.'))return;state=raw.data;await save();go('home');toast('Copia restaurada correctamente')}catch(e){toast('No se pudo importar: '+e.message)}}
function buildSmsSnapshot(){
 const opt=smsSettings();
 return {enabled:!!opt.enabled,endTime:opt.endTime,minutesBefore:Number(opt.minutesBefore)||0,days:opt.days,
  workers:state.people.filter(p=>p.phone&&p.smsConsent&&isPhoneNumber(p.phone)).map(p=>({id:p.id,name:p.name,phone:p.phone,
   tools:state.tools.filter(t=>t.status==='assigned'&&t.personId===p.id).map(t=>({name:t.name,code:t.code}))}))};
}
function smsText(p){

 return 'ToolControl: Hola '+p.name+'. Antes de finalizar la jornada, recuerda devolver al almacen estas herramientas:\n'+list.map((t,i)=>(i+1)+'. '+t.name+' ('+t.code+')').join('\n')+'\nGracias.';
}

"if(window.AppBridge?.getSmsLastStatus)AppBridge.getSmsLastStatus();else toast('El historial de intentos SMS solo se consulta en Android.')">🕘 Ver último intento de SMS</button></div></div>`;

async function saveSmsSettings(){
 const days=Array.from(document.querySelectorAll('.smsDay:checked')).map(x=>Number(x.value));
 const enabled=$('smsEnabled').checked,endTime=$('smsEnd').value,minutesBefore=Number($('smsLead').value);
 if(enabled&&!days.length)return toast('Selecciona al menos un día laboral.');
 if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(endTime))return toast('Selecciona una hora de salida válida.');
 state.settings=state.settings||{};state.settings.sms={enabled,endTime,minutesBefore,days};
 if(!await save())return;
 if(enabled){if(window.AppBridge?.requestSmsPermission)AppBridge.requestSmsPermission();else toast('Guardado. En iPhone abre Mensajes para enviar cada SMS manualmente.');}
 else toast('Recordatorios SMS desactivados.');
 render();
}

  closeScan();
  const dialog=document.createElement('div');dialog.id='scanModal';dialog.className='sheetbg';dialog.style.zIndex='95';
  dialog.innerHTML='<div class="sheet"><div class="sheet-title"><h2>Escanear QR o código de barras</h2><button class="x" onclick="closeScan()">×</button></div><video id="scanVideo" autoplay playsinline muted style="width:100%;border-radius:13px;background:#1b2730;min-height:180px"></video><p class="hint" id="scanHint">Solicitando acceso a la cámara trasera…</p><div class="btnrow"><button class="btn secondary" onclick="$(\'scanImageInput\').click()">📷 Leer desde foto</button><button class="btn outline" onclick="closeScan();toast(\'Puedes escribir el código manualmente.\')">Escribir manualmente</button></div></div>';
  document.body.appendChild(dialog);
  const hint=$('scanHint');
  if(!navigator.mediaDevices?.getUserMedia){hint.textContent='La cámara necesita una página HTTPS en Safari. Puedes introducir el código manualmente.';return;}

function tcDiff(before,after){const result={tools:[],people:[],history:[],settings:null};for(const typ of ['tools','people']){

const tcOldSave=save;

/* ToolControl 1.8 — administradores con usuario, correo opcional y revocación */
let tcAdmins=[],tcAdminsBusy=false,tcDenied=false,tcDeniedMessage='',tcAccessTimer=null;
function tcIsManaged(){return !!tcUser&&/^tc-[a-z][a-z0-9._-]{2,31}@users\.toolcontrol\.example\.com$/i.test(tcUser.email||'')}
function tcAccountDisplay(){const e=tcUser?.email||'';return tcIsManaged()?e.split('@')[0].replace(/^tc-/,''):e}
function tcStringErr(e){return String(e?.message||e||'No se pudo completar la operación').slice(0,230)}
async function tcAdminsCall(action,details={}){
 if(!tcUser||!tcClient||!tcWorkspace)throw Error('Primero abre un inventario compartido');
 if(!navigator.onLine)throw Error('La administración requiere Internet');
 const {data,error}=await tcClient.functions.invoke('tc-admins',{body:{action,workspace:tcWorkspace,...details}});
 if(error){let detail=data?.error||error.message;try{const extra=await error.context?.json?.();detail=extra?.error||detail}catch(_){}throw Error(String(detail||'Error al conectar con administradores'))}
 if(data?.error)throw Error(data.error);
 return data||{};
}
async function tcLoadAdmins(){
 if(!tcCloudOn||tcAdminsBusy)return;
 tcAdminsBusy=true;
 try{const r=await tcAdminsCall('list');tcAdmins=Array.isArray(r.administrators)?r.administrators:[];tcLastError=''}
 catch(e){tcLastError=tcStringErr(e)}finally{tcAdminsBusy=false;if(page==='cloud')render()}
}
async function tcCreateAdmin(){
 if(tcAdminsBusy||tcDenied)return;
 const name=$('tcNewFullName')?.value.trim()||'';
 const username=($('tcNewUsername')?.value||'').trim().toLowerCase();
 const email=$('tcNewContactEmail')?.value.trim()||'';
 const password=$('tcNewPassword')?.value||'';
 if(name.length<2)return toast('Escribe el nombre completo');
 if(!/^[a-z][a-z0-9._-]{2,31}$/.test(username)||username.includes('..')||username.endsWith('.'))return toast('Usuario: 3 a 32 caracteres, empieza con letra');
 if(password.length<10)return toast('Contraseña: mínimo 10 caracteres');
 if(!confirm('¿Autorizar a '+name+' ('+username+') como administrador con todos los permisos?'))return;
 try{
  const r=await tcAdminsCall('create',{name,username,password,email});
  if(!r.ok)throw Error('No se recibió la confirmación');
  toast('Administrador '+username+' creado. Ya puede entrar con su usuario y contraseña');
  await tcLoadAdmins();
 }catch(e){tcLastError=tcStringErr(e);toast(tcLastError);render()}
}
async function tcRemoveAdmin(uid){
 if(tcDenied)return;
 const item=tcAdmins.find(a=>a.id===uid);
 if(!item)return toast('Administrador no encontrado');
 if(item.is_primary)return toast('El administrador principal no puede eliminarse');
 if(!confirm('¿ELIMINAR el acceso de '+item.name+'? No podrá usar el inventario compartido. Su historial se conserva.'))return;
 try{
  await tcAdminsCall('remove',{user_id:uid});
  toast('Acceso de '+item.name+' revocado');
  if(uid===tcUser?.uid){await tcMarkDenied('Tu cuenta fue eliminada como administrador');return}
  await tcLoadAdmins();
 }catch(e){tcLastError=tcStringErr(e);toast(tcLastError);render()}
}
async function tcMarkDenied(message){
 if(tcDenied)return;
 const wid=tcWorkspace;tcDenied=true;tcDeniedMessage=message||'Acceso revocado';
 if(wid){
  await tcQueueStore('tc-supabase-cache-'+wid,tcEmpty());
  await tcQueueStore('tc-supabase-pending-'+wid,[]);
 }
 try{if(tcCloudOn)await tcDisconnect()}catch(e){}
 tcAdmins=[];tcSetStatus('Acceso revocado');syncSmsReminders();
 go('cloud');render();
}
async function tcVerifyActive(){
 if(!tcUser||!navigator.onLine||tcDenied)return;
 if(tcCloudOn&&tcWorkspace){
  try{const data=await tcAdminsCall('check');if(!data.active)await tcMarkDenied('Tu cuenta ya no está en la lista de administradores autorizados')}
  catch(e){/* Una falla de red no prueba que la cuenta esté revocada. */}
 }else if(tcIsManaged()||localStorage.getItem('tc-activated-'+tcUser.uid)==='yes'){
  try{await tcFindWorkspaces();if(!tcAvailable.length)await tcMarkDenied('Este usuario ya no está autorizado')}
  catch(e){}
 }
}
function tcAdminManageView(){
 return `<div class="card"><h3>👥 Administradores autorizados</h3>
 <p class="hint">Todos pueden crear administradores y eliminar otros administradores. La cuenta principal de cada empresa está protegida y no se puede eliminar.</p>
 ${tcAdmins.length?tcAdmins.map(a=>`<div class="item"><div class="item-main"><strong>${esc(a.name)}</strong><small>${esc(a.username?'Usuario: '+a.username:'Cuenta anterior (correo)')}${a.is_self?' · Tú':''}</small></div>${a.is_primary?'<span class="status available" title="Esta cuenta no puede eliminarse">🔒 Principal protegido</span>':`<button class="btn outline" style="color:#a32424;padding:8px 12px;min-width:auto" onclick="tcRemoveAdmin('${a.id}')">Eliminar</button>`}</div>`).join(''):'<p class="hint">Pulsa Actualizar administradores para mostrar la lista.</p>'}
 <button class="btn secondary block" style="margin:12px 0" onclick="tcLoadAdmins()">↻ Actualizar administradores</button></div>
 <div class="card"><h3>➕ Crear administrador</h3>
 <p class="hint">El correo es opcional. El nuevo administrador podrá entrar con el nombre de usuario y la contraseña que le asignes.</p>
 <div class="field"><label>Nombre completo *</label><input id="tcNewFullName" placeholder="Nombre y apellido" autocomplete="off" maxlength="100"></div>
 <div class="field"><label>Nombre de usuario *</label><input id="tcNewUsername" placeholder="ejemplo: carlosperez" autocomplete="off" autocapitalize="none" maxlength="32"></div>
 <div class="field"><label>Contraseña inicial (mínimo 10 caracteres) *</label><input id="tcNewPassword" type="password" autocomplete="new-password" placeholder="Asignar una contraseña segura"></div>
 <div class="field"><label>Correo electrónico (opcional)</label><input id="tcNewContactEmail" type="email" autocomplete="off" placeholder="Dejar vacío si no tiene"></div>
 <p class="hint">El correo opcional es solo de contacto y no está verificado; si se pierde la contraseña, un administrador deberá gestionar la recuperación del acceso.</p>
 <button class="btn primary block" onclick="tcCreateAdmin()">Crear y autorizar administrador</button></div>`;
}
const tcCloudOldView18=tcCloudView;
tcCloudView=function(){
 const logged=!!tcUser;
 if(tcDenied)return `<div class="card"><h3>🔒 Acceso desactivado</h3><p class="alert-card red">${esc(tcDeniedMessage)}</p><p>Esta cuenta no puede consultar, crear ni modificar el inventario. Otro administrador debe autorizar un usuario válido.</p><button class="btn outline block" onclick="tcResetDeniedAndLogout()">Cambiar cuenta</button></div>`;
 return `<div class="card"><h3>☁️ Inventario compartido</h3><p class="hint">ToolControl 2.2 · Empresas independientes, administradores protegidos y herramientas sincronizadas.</p><p class="inline-notice">${esc(tcInfo())}</p>${tcLastError?`<p class="alert-card red">${esc(tcLastError)}</p>`:''}</div>
 <div class="card"><h3>👤 Acceso</h3>${logged?`<p>Cuenta: <b>${esc(tcAccountDisplay())}</b></p><button class="btn outline" onclick="tcLogout()">Cerrar sesión</button>`:`<div class="field"><label>Nombre de usuario (o correo anterior)</label><input type="text" id="tcEmail" autocomplete="username" autocapitalize="none" placeholder="ej.: carlosperez"></div><div class="field"><label>Contraseña</label><input type="password" id="tcPassword" autocomplete="current-password" placeholder="Contraseña"></div><button class="btn primary block" onclick="tcLogin(false)">Entrar</button><p class="hint">Para crear una cuenta nueva, solicita a un administrador autorizado que la registre desde su teléfono. Las cuentas anteriores siguen entrando con correo.</p>`}</div>
 ${logged?`<div class="card"><h3>🏢 Inventario</h3>${tcCloudOn?`<p><b>${esc(tcWorkspaceName)}</b></p><p class="hint">Inventario sincronizado. Los administradores comparten los mismos permisos.</p>${tcOps.length?`<button class="btn secondary block" onclick="tcFlush()">Sincronizar ${tcOps.length} cambios pendientes</button>`:''}<button class="btn outline block" onclick="tcImportLocal()">Importar inventario de este celular (solo nube vacía)</button><button class="btn outline block" onclick="tcLeaveWorkspace()" style="margin-top:10px">Cambiar inventario</button>`:`<button class="btn outline block" onclick="tcReloadWorkspaces()">Actualizar inventarios compartidos</button>${tcAvailable.length?`<label>Inventarios autorizados:</label>${tcAvailable.map(w=>`<button class="btn secondary block" style="margin-top:9px" onclick="tcConnect('${esc(w.id)}')">Abrir ${esc(w.name)}</button>`).join('')}`:''}<p class="hint">Para crear una empresa diferente, entra con su administrador principal y utiliza «Agregar otra empresa».</p>`}</div>`:''}
 ${tcCloudOn?tcAdminManageView():''}
 <div class="card"><h3>🔔 SMS y conexión</h3><p class="hint">Los administradores necesitan conexión para validar su autorización. Por seguridad, las cuentas creadas por administradores no registrarán cambios sin Internet.</p><label><input type="checkbox" ${tcWorkspace&&localStorage.getItem('tc-sms-primary-'+tcWorkspace)==='yes'?'checked':''} onchange="tcSetPrimarySms(this.checked)"> Este teléfono enviará los SMS</label></div>`;
};
const tcOriginalLogin18=tcLogin;
tcLogin=async function(signup){
 try{
  if(!tcClient)await tcSdk();
  const id=($('tcEmail')?.value||'').trim().toLowerCase();
  const pw=$('tcPassword')?.value||'';
  if(!id||!pw)throw Error('Introduce usuario y contraseña');
  const email=id.includes('@')?id:`tc-${id}@users.toolcontrol.example.com`;
  const{data,error}=await tcClient.auth.signInWithPassword({email,password:pw});
  if(error)throw error;
  tcDenied=false;tcDeniedMessage='';tcLastError='';
  tcUser={uid:data.user.id,email:data.user.email};
  await tcAuthUpdated();
  if(tcIsManaged()&&!tcAvailable.length)await tcMarkDenied('Este usuario no ha sido autorizado para un inventario');
  else toast('Sesión iniciada: '+tcAccountDisplay());
 }catch(e){const msg=tcStringErr(e);tcLastError=/invalid login credentials/i.test(msg)?'Nombre de usuario o contraseña incorrectos':msg;toast(tcLastError)}finally{render()}
};
const tcOriginalConnect18=tcConnect;
tcConnect=async function(wid){
 if(tcDenied)return false;
 const ok=await tcOriginalConnect18(wid);
 if(ok){localStorage.setItem('tc-activated-'+tcUser.uid,'yes');await tcLoadAdmins();await tcVerifyActive()}
 return ok;
};
const tcOriginalLogout18=tcLogout;
tcLogout=async function(){
 await tcOriginalLogout18();tcAdmins=[];tcDenied=false;tcDeniedMessage='';render();
};
async function tcResetDeniedAndLogout(){
 try{if(tcClient)await tcClient.auth.signOut()}catch(e){}
 tcUser=null;tcAdmins=[];tcDenied=false;tcDeniedMessage='';tcAvailable=[];tcSetStatus('Sin iniciar sesión');go('cloud');render();
}
const tcOriginalSave18=save;
save=async function(){
 if(tcDenied)return false;
 if(!tcUser||!tcCloudOn||(tcIsManaged()&&!navigator.onLine)){toast('Debes iniciar sesión y abrir un inventario autorizado. Los usuarios nuevos necesitan Internet.');return false}
 return tcOriginalSave18();
};
const tcOriginalGo18=go;
go=function(p){if((tcDenied||!tcUser||!tcCloudOn)&&p!=='cloud')p='cloud';return tcOriginalGo18(p)};
const tcOriginalRender18=render;
render=function(){
 if((tcDenied||!tcUser||!tcCloudOn)&&page!=='cloud')page='cloud';
 tcOriginalRender18();
 if(tcDenied){$('heading').textContent='Acceso desactivado';$('bottomnav').innerHTML='';$('content').innerHTML=tcCloudView();}
 else if(!tcUser||!tcCloudOn){$('heading').textContent='Acceso a ToolControl';$('bottomnav').innerHTML='';$('content').innerHTML=tcCloudView();}
};
// Checks on reconnect and periodically. Online access is validated server-side by RLS and RPC too.
window.addEventListener('online',()=>setTimeout(()=>tcVerifyActive().catch(()=>{}),400));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tcVerifyActive().catch(()=>{})});
if(!tcAccessTimer)tcAccessTimer=setInterval(()=>tcVerifyActive().catch(()=>{}),12000);
// Cancel SMS when the administrator has been revoked or has not authenticated.
const tcSmsBeforeAuth18=syncSmsReminders;
syncSmsReminders=function(){
 if(tcDenied||!tcUser){
  if(window.AppBridge?.syncSmsReminders){const reminder=buildSmsSnapshot();reminder.enabled=false;window.AppBridge.syncSmsReminders(JSON.stringify(reminder))}
  return;
 }
 return tcSmsBeforeAuth18();
};

/* ToolControl 2.1 — Empresas completamente independientes */
let tcCompanyFormOpen=false,tcCompanyBusy=false;
function tcIsCompanyPrincipal(){return !!(tcUser&&tcCloudOn&&tcAdmins.some(a=>a.id===tcUser.uid&&a.is_primary));}
function tcCompanySection(){
 if(!tcIsCompanyPrincipal())return '';
 return `<div class="card" id="tcCompanyPanel"><h3>🏢 Empresas</h3>
 <p class="hint">Empresa actual: <b>${esc(tcWorkspaceName)}</b>. Puedes crear otra empresa con un correo y contraseña diferentes. Sus herramientas, trabajadores y administradores estarán separados de esta empresa.</p>
 <button class="btn ${tcCompanyFormOpen?'outline':'primary'} block" onclick="tcCompanyFormOpen=!tcCompanyFormOpen;render()">${tcCompanyFormOpen?'Cerrar formulario':'➕ Agregar otra empresa'}</button>
 ${tcCompanyFormOpen?`<div style="margin-top:16px">
 <div class="field"><label>Nombre de la nueva empresa *</label><input id="tcCompanyNewName" maxlength="90" autocomplete="off" placeholder="Ej.: Empresa de mantenimiento"></div>
 <div class="field"><label>Correo del nuevo administrador principal *</label><input id="tcCompanyOwnerEmail" type="email" autocomplete="off" autocapitalize="none" placeholder="empresa2@ejemplo.com"></div>
 <div class="field"><label>Contraseña del nuevo administrador (10 caracteres mínimo) *</label><input id="tcCompanyOwnerPassword" type="password" autocomplete="new-password" placeholder="Contraseña segura"></div>
 <div class="field"><label>Confirmar contraseña *</label><input id="tcCompanyOwnerConfirm" type="password" autocomplete="new-password" placeholder="Repite la contraseña"></div>
 <p class="hint">Al crear la empresa se registrará un inventario vacío y un administrador principal protegido. No se enviará correo de confirmación: verifica que el correo esté bien escrito. La contraseña se entrega al responsable por un medio seguro. Para abrir la otra empresa, cierra sesión e inicia con su correo y contraseña.</p>
 <button class="btn primary block" ${tcCompanyBusy?'disabled':''} onclick="tcCreateCompany()">${tcCompanyBusy?'Creando empresa...':'Crear empresa y administrador principal'}</button>
 </div>`:''}</div>`;
}
async function tcCreateCompany(){
 if(tcCompanyBusy)return;
 if(!tcIsCompanyPrincipal())return toast('Solo el administrador principal puede agregar otra empresa');
 const company_name=($('tcCompanyNewName')?.value||'').trim();
 const email=($('tcCompanyOwnerEmail')?.value||'').trim().toLowerCase();
 const password=$('tcCompanyOwnerPassword')?.value||'';
 const confirmPassword=$('tcCompanyOwnerConfirm')?.value||'';
 if(company_name.length<2||company_name.length>90)return toast('Introduce el nombre de la empresa');
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return toast('Introduce un correo válido');
 if(password.length<10||password.length>128)return toast('La contraseña debe tener entre 10 y 128 caracteres');
 if(password!==confirmPassword)return toast('Las contraseñas no coinciden');
 if(!navigator.onLine)return toast('Se necesita Internet para registrar empresas');
 if(!confirm('¿Crear la empresa «'+company_name+'» con «'+email+'» como administrador principal? El inventario empezará vacío y estará separado de '+tcWorkspaceName+'.'))return;
 tcCompanyBusy=true;
 try{
  const data=await tcAdminsCall('create_company',{company_name,email,password});
  if(!data.ok)throw Error(data.error||'No se pudo crear la empresa');
  tcCompanyFormOpen=false;
  toast('Empresa «'+company_name+'» creada. Para entrar, cierra sesión y usa '+email);
  tcLastError='';
  render();
 }catch(e){tcLastError=tcStringErr(e);toast(tcLastError)}finally{tcCompanyBusy=false}
}
const tcHomeViewBeforeCompanies20=homeView;
homeView=function(){
 const top=tcCloudOn?`<div class="card"><strong>🏢 Empresa activa: ${esc(tcWorkspaceName)}</strong><p class="hint">Estás viendo únicamente las herramientas y trabajadores de esta empresa.</p></div>`:'';
 return top+tcHomeViewBeforeCompanies20();
};
const tcCloudViewBeforeCompanies20=tcCloudView;
tcCloudView=function(){
 const view=tcCloudViewBeforeCompanies20();
 const anchor='<div class="card"><h3>👥 Administradores autorizados</h3>';
 return tcIsCompanyPrincipal()?view.replace(anchor,tcCompanySection()+anchor):view;
};
