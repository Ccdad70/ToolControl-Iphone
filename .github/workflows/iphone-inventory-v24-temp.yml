name: Integrar inventario V2.4 en sitio iPhone (temporal)
on:
  push:
    branches: [feature/inventario-grupos-busqueda-v24-iphone]
permissions:
  contents: write
jobs:
  validar-integrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar código y funciones originales
        shell: bash
        run: |
          set -euo pipefail
          node --check tc-iphone-updates-2.2.js
          node --check tc-iphone-followup-2.4.js
          node --check tc-iphone-inventory-v24.js
          node --check sw.js
          node tests/test-inventory-iphone-v24.cjs
          grep -q 'function inventoryView' index.html
          grep -q 'function openBrowserScanner' index.html
          grep -q 'tc-iphone-followup-2.4.js' index.html
          grep -q 'tc-iphone-inventory-v24.js' sw.js
      - name: Añadir módulo solo tras los módulos iPhone existentes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          src=p.read_text(encoding='utf-8')
          marker='<script src="./tc-iphone-followup-2.4.js"></script>'
          tag='<script src="./tc-iphone-inventory-v24.js"></script>'
          assert src.count(marker)==1, 'No coincide el final de los scripts iPhone'
          if tag not in src:
              src=src.replace(marker,marker+'\n'+tag)
              p.write_text(src,encoding='utf-8')
          assert src.count(tag)==1
          assert src.index(tag)>src.index(marker)
          print('Módulo de Inventario General cargado después de funciones iPhone V2.4')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet index.html; then
            git add index.html
            git commit -m "Cargar inventario V2.4 iPhone sin modificar operaciones existentes [skip ci]"
            git push
          fi
