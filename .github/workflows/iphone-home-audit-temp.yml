name: Auditar pantalla inicio iPhone (temporal)
on:
  push:
    branches: [feature/iphone-home-android-style-v24]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Extraer HTML y estilos sin imágenes incrustadas
      run: |
        python3 - <<'PY'
        from pathlib import Path
        import re
        s=Path('index.html').read_text(encoding='utf8')
        s=re.sub(r'data:image/[a-zA-Z0-9.+-]+;base64,[A-Za-z0-9+/=]+','[IMAGEN_INCRUSTADA]',s)
        pattern=[r'function homeView\s*\(',r'function render\s*\(',r'function navButton\s*\(',r'function go\s*\(',r'function assignView\s*\(',r'function returnView\s*\(',r'function inventoryView\s*\(',r'function toolForm\s*\(',r'\.brand-attribution\s*\{',r'\.home-actions\s*\{',r'\.quick-actions\s*\{',r'\.stats\s*\{',r'\.stat\s*\{',r'body\s*\{',r'\.bottomnav\s*\{',r'#bottomnav\s*\{']
        out=[]
        for pat in pattern:
          found=list(re.finditer(pat,s,re.I))
          out.append('\n## '+pat+' (occurrences '+str(len(found))+')')
          for m in found[:4]:
            start=m.start()
            end=start+(18000 if 'homeView' in pat else 4300)
            out.append('LINE '+str(s.count('\n',0,start)+1)+'\n'+s[max(0,start-250):end])
        Path('audit-home-clean.txt').write_text('\n'.join(out)[:130000],encoding='utf8')
        PY
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add audit-home-clean.txt
        git commit -m 'Analizar interfaz Inicio iPhone sin imágenes [skip ci]'
        git push
