name: Integrar recuadro de lector iPhone V2.4 (temporal)
on:
  push:
    branches: [feature/iphone-animated-scan-frame-v24]
permissions:
  contents: write
jobs:
  test-integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pruebas de código QR y marco animado
        shell: bash
        run: |
          set -euo pipefail
          node --check tc-iphone-scanner-frame-v24.js
          node --check tc-iphone-inventory-v24.js
          node tests/test-iphone-scanner-frame-v24.cjs
          node tests/test-inventory-iphone-v24.cjs
          node --check sw.js
          grep -Fq 'toolcontrol-iphone-v24-scanner-frame-v2' sw.js
      - name: Instalar visor animado después de scripts existentes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          src=p.read_text(encoding='utf-8')
          marker='<script src="./tc-iphone-inventory-v24.js"></script>'
          tag='<script src="./tc-iphone-scanner-frame-v24.js"></script>'
          assert src.count(marker)==1,'No se encontró el enlace al inventario V2.4'
          if tag not in src:
              src=src.replace(marker,marker+'\n'+tag)
              p.write_text(src,encoding='utf-8')
          assert src.count(tag)==1
          assert src.index(tag)>src.index(marker)
          assert 'function openBrowserScanner' in src
          assert 'function openContinuousBrowserScanner' in src
          print('Marco visual integrado en index.html, sin modificar funciones de escaneo')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet index.html; then
            git add index.html
            git commit -m "Cargar marco animado para QR después de los scripts de iPhone [skip ci]"
            git push
          fi
