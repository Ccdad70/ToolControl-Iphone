name: Auditar Inventario iPhone (temporal)
on:
  push:
    branches: [feature/inventario-grupos-busqueda-v24-iphone]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Inspeccionar sección y escáner del iPhone
      shell: bash
      run: |
        python3 - <<'PY'
        from pathlib import Path
        import re
        txt=Path('index.html').read_text(encoding='utf8')
        patterns=[
          r'function inventoryView',r'function renderInventoryItems',r'function toolsHtml',
          r'function openScan',r'function closeScan',r'function receiveContinuousCode',
          r'function scanCode',r'function openContinuousBrowserScanner',r'function receiveNativeScan',
          r'function showTool',r'function render\(',r'function saveTool',
          r'let database=',r'const allTools=',r'function toolForm',r'function startScan',
          r'tc-iphone-followup-2\.4\.js',r'tc-iphone-updates-2\.2\.js',
          r'sw\.js',r'@zxing',r'BarcodeDetector',r'function scanner',
          r'function go\(',r'function filteredTools',
        ]
        output=['TOTAL SIZE '+str(len(txt))+' LINES '+str(txt.count(chr(10))+1)]
        for pat in patterns:
          matches=list(re.finditer(pat,txt,re.I))
          output.append('\n### '+pat+' '+str(len(matches)))
          for item in matches[:4]:
            loc=item.start()
            output.append('OFFSET '+str(loc)+' LINE '+str(txt.count(chr(10),0,loc)+1)+'\n'+txt[max(0,loc-190):min(len(txt),loc+min(3600 if 'inventory' in pat.lower() or 'scan' in pat.lower() else 900,3700))])
        output.append('\n### LAST SCRIPTS\n'+txt[-4000:])
        Path('iphone-audit.txt').write_text('\n'.join(output)[:90000],encoding='utf8')
        PY
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add iphone-audit.txt
        git commit -m "Audit inventory and scanner functions [skip ci]"
        git push
