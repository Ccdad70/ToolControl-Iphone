name: Publicar aviso de desactivación ToolControl iPhone
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: toolcontrol-iphone-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verificar que ToolControl iPhone no se publique
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'LINK FUE DESACTIVADO' index.html
          grep -Fq 'POR SU CREADOR' index.html
          grep -Fq 'LINK FUE DESACTIVADO' sw.js
          if grep -Eq '<script[[:space:]]+src=' index.html; then
            echo 'ERROR: La pantalla de cierre no puede cargar scripts de ToolControl' >&2
            exit 1
          fi
          node --check sw.js
      - name: Preparar sitio estático de cierre (sin archivos de aplicación)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-disabled
          cp index.html sw.js public-disabled/
          touch public-disabled/.nojekyll
          test "$(find public-disabled -maxdepth 1 -type f | wc -l)" -eq 3
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-disabled
      - name: Publicar aviso de desactivación
        id: deployment
        uses: actions/deploy-pages@v4
