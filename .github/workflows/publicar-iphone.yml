name: Publicar ToolControl para iPhone
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: toolcontrol-iphone-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar versión iPhone 2.2 sin selector de envío SMS
        run: python3 .github/scripts/prepare_iphone.py
      - name: Validar JavaScript y caché de iPhone
        run: |
          node --check tc-iphone-updates-2.2.js
          node --check tc-iphone-followup-2.4.js
          node --check tc-iphone-inventory-v24.js
          node --check tc-iphone-scanner-frame-v24.js
          node tests/test-inventory-iphone-v24.cjs
          node tests/test-iphone-scanner-frame-v24.cjs
          node --check tc-iphone-home-android-v24.js
          node --check tc-iphone-daily-sms-status-v241.js
          node tests/test-iphone-daily-sms-v241.cjs
          node --check tc-iphone-daily-admin-v24.js
          node tests/test-iphone-morning-schedule-v242.cjs
          grep -q 'tc_morning_v263_config_save' tc-iphone-daily-admin-v24.js
          grep -q 'tc_morning_v269_iphone_status' tc-iphone-daily-sms-status-v241.js
          ! grep -q 'tc_daily_admin_config' tc-iphone-daily-admin-v24.js
          grep -q 'tc-iphone-daily-admin-v24.js' index.html
          grep -q 'tc-iphone-daily-admin-v24.js' sw.js
          node tests/test-iphone-home-android-v24.cjs
          grep -q 'tc-iphone-home-android-v24.js' index.html
          grep -q 'tc-iphone-home-android-v24.js' sw.js
          grep -q 'tc-iphone-daily-sms-status-v241.js' index.html
          grep -q 'tc-iphone-daily-sms-status-v241.js' sw.js
          grep -q 'tc-iphone-scanner-frame-v24.js' index.html
          grep -q 'tc-iphone-scanner-frame-v24.js' sw.js
          grep -q 'tc-iphone-inventory-v24.js' index.html
          grep -q 'tc-iphone-inventory-v24.js' sw.js
          grep -q 'tc_followup_list' tc-iphone-followup-2.4.js
          node --check sw.js
          grep -q "tc_admin_phone_save" tc-iphone-updates-2.2.js
          grep -q "tcSmsViewerFetch" tc-iphone-updates-2.2.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
