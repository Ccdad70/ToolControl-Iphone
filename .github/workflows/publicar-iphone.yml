name: Publicar ToolControl para iPhone
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: toolcontrol-iphone-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar versión iPhone 2.2 sin selector de envío SMS
        run: python3 .github/scripts/prepare_iphone.py
      - name: Validar JavaScript y caché de iPhone
        run: |
          node --check tc-iphone-updates-2.2.js
          node --check sw.js
          grep -q "tc_admin_phone_save" tc-iphone-updates-2.2.js
          grep -q "tcSmsViewerFetch" tc-iphone-updates-2.2.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
