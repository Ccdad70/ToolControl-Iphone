name: Integrar inicio iPhone como Android (temporal)
on:
  push:
    branches: [feature/iphone-home-android-style-v24]
permissions:
  contents: write
jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar componentes y operaciones existentes
        shell: bash
        run: |
          set -euo pipefail
          node --check tc-iphone-home-android-v24.js
          node tests/test-iphone-home-android-v24.cjs
          node --check tc-iphone-inventory-v24.js
          node tests/test-inventory-iphone-v24.cjs
          node --check tc-iphone-scanner-frame-v24.js
          node tests/test-iphone-scanner-frame-v24.cjs
          grep -Fq 'toolcontrol-iphone-v24-home-android-style-v3' sw.js
          grep -Fq 'tc-iphone-home-android-v24.js' sw.js
          grep -Fq "go('toolnew')" tc-iphone-home-android-v24.js
          grep -Fq "go('inventory')" tc-iphone-home-android-v24.js
      - name: Cargar nueva pantalla al final de módulos iPhone
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          anchor='<script src="./tc-iphone-scanner-frame-v24.js"></script>'
          added='<script src="./tc-iphone-home-android-v24.js"></script>'
          assert s.count(anchor)==1,'No se encontró el lector actual de iPhone'
          assert 'function homeView' in s
          assert 'function saveTool' in s
          assert 'function openContinuousBrowserScanner' in s
          assert 'tc-iphone-updates-2.2.js' in s
          if added not in s:
              s=s.replace(anchor,anchor+'\n'+added)
              p.write_text(s,encoding='utf-8')
          assert s.count(added)==1
          assert s.index(added)>s.index(anchor)
          print('Inicio iPhone V2.4 actualizado, sin cambiar HTML original del inventario y sus funciones')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet index.html; then
            git add index.html
            git commit -m "Incluir pantalla Inicio estilo Android en iPhone V2.4 [skip ci]"
            git push
          fi
