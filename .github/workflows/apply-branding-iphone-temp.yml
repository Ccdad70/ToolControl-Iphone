name: Aplicar nuevo logo comercial iPhone V2.4
on:
  push:
    branches: [feature/branding-toolcontrol-comercial-v24]
permissions:
  contents: write
jobs:
  branding:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar imágenes de logo y reemplazarlas
        run: |
          python -m pip install --quiet "Pillow>=11.3.0"
          python branding/apply_logo.py
      - name: Validar código y diseños existentes
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          html=Path('index.html').read_text(encoding='utf8')
          assert 'src="./toolcontrol-logo.png"' in html
          assert 'tc-iphone-inventory-v24.js' in html
          assert 'tc-iphone-home-android-v24.js' in html
          assert 'tc-iphone-scanner-frame-v24.js' in html
          assert 'toolcontrol-iphone-v24-nuevo-logo-comercial' in Path('sw.js').read_text()
          for name in ('toolcontrol-logo.png','toolcontrol-app-icon.png'):
              with Image.open(name) as im: im.verify()
          print('OK: nuevos recursos gráficos iPhone sin afectar funciones')
          PY
          node --check tc-iphone-inventory-v24.js
          node --check tc-iphone-home-android-v24.js
          node --check tc-iphone-scanner-frame-v24.js
          node --check sw.js
          for test in tests/*.cjs; do node "$test"; done
      - name: Guardar cambios en rama
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html icon.svg manifest.webmanifest sw.js toolcontrol-logo.png toolcontrol-app-icon.png
          git diff --cached --quiet && exit 0
          git commit -m "Sustituir logos e iconos anteriores por identidad ToolControl comercial [skip ci]"
          git push
