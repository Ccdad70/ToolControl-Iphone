<script>
function escapeHTML(value = '') {
  return String(value).replace(/[&<>"']/g, (ch) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

// URLs are treated as data, never interpreted as markup/code.
function validStreamUrl(value, {localDemo=false}={}) {
  if (typeof value !== 'string' || !value.trim() || value.length > 3000) return false;
  const trimmed = value.trim();
  if (localDemo && /^\.\/media\/[\w.\-/]+\.mp4$/i.test(trimmed)) return true;
  try {
    const url = new URL(trimmed);
    return url.protocol === 'https:' || url.protocol === 'http:';
  } catch { return false; }
}
function validImageUrl(value, {localDemo=false}={}) {
  if (!value) return true;
  if (localDemo && /^assets\/[\w.\-/]+\.(png|jpe?g|webp)$/i.test(String(value))) return true;
  try { const u = new URL(value); return u.protocol === 'https:'; }
  catch { return false; }
}
function normalizeItem(raw, {allowDemo=false}={}) {
  if (!raw || typeof raw !== 'object') return null;
  const kind = ['live','movie','series'].includes(raw.kind) ? raw.kind : null;
  if (!kind || !validStreamUrl(raw.url, {localDemo: allowDemo})) return null;
  const title = String(raw.title ?? '').trim().slice(0, 100);
  if (!title) return null;
  const safe = {
    id: String(raw.id || `entry-${cryptoRandom()}`).slice(0, 100),
    title,
    kind,
    url: raw.url.trim(),
    category: String(raw.category || (kind === 'live' ? 'General' : 'Entretenimiento')).trim().slice(0, 50),
    description: String(raw.description || '').trim().slice(0, 500),
    year: String(raw.year || '').slice(0, 4),
    image: validImageUrl(raw.image, {localDemo: allowDemo && Boolean(raw.sample)}) ? String(raw.image || '') : '',
    season: Number.isInteger(Number(raw.season)) ? Math.max(0, Math.min(99, Number(raw.season))) : 0,
    episode: Number.isInteger(Number(raw.episode)) ? Math.max(0, Math.min(999, Number(raw.episode))) : 0,
    seriesName: String(raw.seriesName || '').trim().slice(0, 100),
    sample: Boolean(raw.sample && allowDemo),
    source: String(raw.source || 'manual').slice(0, 100)
  };
  return safe;
}
function cryptoRandom() { return Math.random().toString(36).slice(2, 12); }
function parseM3U(text, source='M3U importada') {
  if (typeof text !== 'string' || text.length > 2_000_000) throw new Error('Lista M3U demasiado grande (máximo 2 MB).');
  const lines = text.replace(/^\uFEFF/,'').split(/\r?\n/);
  const result = [];
  let meta = null;
  for (const lineRaw of lines) {
    const line = lineRaw.trim();
    if (/^#EXTINF:/i.test(line)) {
      const fields = line.match(/group-title\s*=\s*["']([^"']*)["']/i);
      const image = line.match(/tvg-logo\s*=\s*["']([^"']*)["']/i);
      const comma = line.indexOf(',');
      meta = {
        title: comma < 0 ? 'Canal' : line.slice(comma+1).trim() || 'Canal',
        category: fields?.[1] || 'General', image: image?.[1] || ''
      };
    } else if (line && !line.startsWith('#')) {
      if (validStreamUrl(line)) {
        const item = normalizeItem({kind:'live', title: meta?.title || `Canal ${result.length+1}`,
          category: meta?.category || 'General', image: meta?.image || '', url:line,
          source}, {allowDemo:false});
        if (item) result.push(item);
      }
      meta = null;
      if (result.length >= 500) break;
    }
  }
  return result;
}
function normalizeCatalogSearch(value){return String(value??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('es').trim();}
function chooseItems(items, {kind, category='Todos', q=''}={}) {
  const query = normalizeCatalogSearch(q);
  return items.filter(item => (!kind || item.kind === kind)
    && (category === 'Todos' || item.category === category)
    && (!query || [item.title,item.category,item.description,item.seriesName]
      .some(part => normalizeCatalogSearch(part).includes(query))));
}
function filterPrivateMovies(items, q){
 const query=normalizeCatalogSearch(q);
 return query?items.filter(it=>normalizeCatalogSearch(it.title).includes(query)):items;
}

function uniqueHash(str){let n=2166136261;for(let i=0;i<str.length;i++){n^=str.charCodeAt(i);n=Math.imul(n,16777619);}return (n>>>0).toString(36);}

function parseCountryPlaylist(text,country){
 // Señales oficiales y comunitarias con estado verified para todos los países; la lista comunitaria blanca se aplica únicamente a Venezuela.
 if(typeof text!=='string'||text.length>3000000)throw Error('Lista demasiado grande');
 const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/);
 const items=[]; const seen=new Set();
 for(let i=0;i<lines.length-1;i++){
  const meta=lines[i].trim();
  if(!meta.startsWith('#EXTINF:'))continue;
  const community=/x-tier\s*=\s*["']community["']/i.test(meta);
  /* community status verified is allowed for all countries; a browser video probe is still required */
  if(community&&!/x-status\s*=\s*["']verified["']/i.test(meta))continue;
  if(/x-status\s*=\s*["'](?:restricted|unreachable|invalid|intermittent|unknown)["']/i.test(meta))continue;
  const url=String(lines[i+1]||'').trim();
  if(!/^https:\/\//i.test(url)||!/\.m3u8(?:[?#]|$)/i.test(url)||seen.has(url))continue;
  const title=meta.slice(meta.indexOf(',')+1).trim()||'Canal gratuito';
  if(country[0]==='ve'&&REMOVED_VE_CHANNELS.test(title.normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim()))continue;
  if(country[0]==='ve'&&community&&!/^(?:Telesur(?: \(English HD\))?|TVes|PromarTV|ShowVen TV|Televisora de Oriente|Vepaco TV|Catatumbo TV|Grande TV|Isla TV|TVS|Canal C del Zulia|Tu TV|BTA TV)$/i.test(title))continue;
  if(/\b(adult|xxx|porn|casino|gambling)\b/i.test(title))continue;
  if(community&&/^(?:canal 11|sport\s*tv|sky\s*sports|hbo|max premium|disney\s*channel)(?:\b|\s|$)/i.test(title))continue;
  seen.add(url);
  const group=(meta.match(/group-title\s*=\s*["']([^"']+)["']/i)||[])[1]||'TV gratuita';
  const source=(community?'Nexonic comunidad verificada · ':'Nexonic oficial · ')+country[2];
  const description=community?'Emisión gratuita listada como comunidad verificada por Nexonic. NÉVIX comprueba si el manifiesto HLS es accesible desde tu Samsung; la inserción puede depender del emisor.':'Señal publicada gratuitamente por su emisor; NÉVIX comprueba el manifiesto HLS antes de mostrarla.';
  const image=(meta.match(/tvg-logo\s*=\s*["']([^"']+)["']/i)||[])[1]||'';
   const channelId=(meta.match(/tvg-id\s*=\s*["']([^"']+)["']/i)||[])[1]||'';
   const item=normalizeItem({kind:'live',title,short:title,category:country[1]+' '+country[2],url,source,description,image,direct:true,unverified:community});
  if(item)items.push({...item,id:'official-'+country[0]+'-'+uniqueHash(url),flag:country[1],short:title,channelId,genre:group,verifiedManifest:false,source,countryCode:country[0],direct:true,unverified:community});
 }
 // Mostrar primero noticias y canales generales, sin presumir que los otros son de pago.
 items.sort((a,b)=>{const rank=x=>/news|noticias|general|public|cultura|educa/i.test(x.genre||'')?0:1;return rank(a)-rank(b);});
 return items.slice(0,48);
}
async function checkBrowserStream(it, signal){
 // Una comprobación lenta nunca debe bloquear la selección de otro país.
 if(signal?.aborted)return false;
 const ctrl=new AbortController();
 const cancelManifest=()=>ctrl.abort();
 signal?.addEventListener('abort',cancelManifest,{once:true});
 const manifestTimeout=setTimeout(()=>ctrl.abort(),4500);
 try{
  const response=await fetch(it.url,{mode:'cors',credentials:'omit',cache:'no-store',signal:ctrl.signal,redirect:'follow'});
  if(!response.ok)return false;
  const txt=await response.text();
  if(!txt.trimStart().startsWith('#EXTM3U')||txt.length>500000)return false;
 }catch(_){return false;}
 finally{
  clearTimeout(manifestTimeout);
  signal?.removeEventListener('abort',cancelManifest);
 }
 if(signal?.aborted)return false;
 // La reproducción se comprueba sin mostrar controles ni mensajes técnicos.
 return await new Promise(resolve=>{
  const holder=document.createElement('div');
  holder.setAttribute('aria-hidden','true');
  holder.style.cssText='position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none;overflow:hidden;z-index:-1';
  const video=document.createElement('video');
  video.setAttribute('muted','');video.muted=true;video.defaultMuted=true;
  video.setAttribute('playsinline','');video.playsInline=true;
  video.autoplay=true;video.preload='auto';
  holder.appendChild(video);document.body.appendChild(holder);
  let hls=null,ended=false,confirmedTimer=null;
  const finish=ok=>{
   if(ended)return;
   ended=true;clearTimeout(t);clearTimeout(confirmedTimer);
   signal?.removeEventListener('abort',cancelVideo);
   try{video.pause();}catch(_){}
   try{hls?.destroy();}catch(_){}
   try{video.removeAttribute('src');video.load();}catch(_){}
   holder.remove();resolve(Boolean(ok));
  };
  const cancelVideo=()=>finish(false);
  let firstTime=null;const confirmed=()=>{if(!ended&&!video.paused&&video.readyState>=2&&video.videoWidth>16&&video.videoHeight>16){if(firstTime===null)firstTime=video.currentTime;else if(video.currentTime-firstTime>=0.5)finish(true);}};
  const t=setTimeout(()=>finish(false),8500);
  signal?.addEventListener('abort',cancelVideo,{once:true});
  if(signal?.aborted){finish(false);return;}
  video.addEventListener('playing',()=>{confirmed();if(!ended)confirmedTimer=setTimeout(confirmed,600);});
  video.addEventListener('timeupdate',confirmed);
  video.addEventListener('loadeddata',()=>{if(!ended&&video.readyState>=2&&!video.paused)confirmed();});
  video.addEventListener('error',()=>finish(false));
  video.addEventListener('encrypted',()=>finish(false));
  try{
   const lib=window.Hls;
   if(lib?.isSupported?.()){
    hls=new lib({enableWorker:true,lowLatencyMode:true,maxBufferLength:4,maxMaxBufferLength:6,fragLoadingMaxRetry:1,manifestLoadingMaxRetry:1,levelLoadingMaxRetry:1});
    hls.on(lib.Events.MEDIA_ATTACHED,()=>{if(!ended)hls.loadSource(it.url);});
    hls.on(lib.Events.MANIFEST_PARSED,()=>{if(!ended)video.play().catch(()=>finish(false));});
    hls.on(lib.Events.ERROR,(_event,data)=>{if(data?.fatal)finish(false);});
    hls.attachMedia(video);
   }else if(video.canPlayType('application/vnd.apple.mpegurl')){
    video.src=it.url;video.play().catch(()=>finish(false));
   }else finish(false);
  }catch(_){finish(false);}
 });
}

const WATCHMODE_BACKEND='https://nevix-catalog-api.onrender.com';
function mapWatchmodeSeries(row,section){return {id:'wm-series-'+String(row.id),watchmode:true,watchmodeId:String(row.id),kind:'series',netflix:true,title:String(row.title||'Sin título').slice(0,130),short:String(row.title||'Sin título'),seriesName:String(row.title||'Sin título').slice(0,130),category:'Series',year:String(row.year||''),rank:Number(row.rank)||0,image:String(row.image||''),description:String(row.overview||'').slice(0,350),source:'Watchmode',free:false,section};}
function mapMovie(row,section){
 return {id:'wm-'+String(row.id),watchmode:true,watchmodeId:String(row.id),kind:'movie',netflix:true,title:String(row.title||'Sin título').slice(0,130),short:String(row.title||'Sin título'),category:'Película',year:String(row.year||''),rank:Number(row.rank)||0,image:String(row.image||''),description:String(row.overview||'').slice(0,350),source:'Watchmode',free:false,section};

async function loadWatchmodeSection(section,next=false){
 if(state.movieLoading[section])return;
 const page=next?state.moviePage[section]+1:1;
 if(next&&page>state.movieTotalPages[section])return;
 state.movieLoading[section]=true;state.movieError='';render();
 try{
  const res=await fetch(WATCHMODE_BACKEND+'/api/movies?section='+section+'&page='+page,{cache:'no-store',signal:AbortSignal.timeout(50000)});
  const data=await res.json();
  if(!netflixCatalogEnabled)return;
  if(!res.ok)throw Error(data.error==='missing_key'?'Es necesario configurar Watchmode en Render.':data.message||'No se pudo consultar el catálogo.');
  const key=section==='recent'?'movieRecentItems':'moviePopularItems';
  const mapped=(Array.isArray(data.titles)?data.titles:[]).map(x=>mapMovie(x,section));
  const seen=new Set(next?state[key].map(x=>x.id):[]);
  state[key]=[...(next?state[key]:[]),...mapped.filter(x=>!seen.has(x.id))];
  state.moviePage[section]=page;
  state.movieTotalPages[section]=Number(data.totalPages)||page;
  saveCatalogSnapshot();
 }catch(e){state.movieError=String(e?.message||'No fue posible actualizar las películas.');}
 finally{state.movieLoading[section]=false;render();}
}
function loadWatchmodeCatalog(){
 if(state.movieAttempted)return;

}
async function openWatchmodeTitle(it){

  const res=await fetch(WATCHMODE_BACKEND+'/api/movie/'+encodeURIComponent(it.watchmodeId),{cache:'no-store',signal:AbortSignal.timeout(22000)});
  const data=await res.json();
  if(!res.ok)throw Error(data.message||'No se pudo consultar el enlace.');
  if(!/^https:\/\/([a-z0-9-]+\.)?netflix\.com\//i.test(String(data.webUrl||'')))return toast('No se encontró enlace oficial a Netflix en Estados Unidos o Colombia.');
  location.assign(data.webUrl);

}

async function privateRequest(route,code,adminAccess=false,method='GET',payload=null){
 const headers={};
 if(code)headers[adminAccess?'X-Nevix-Admin-Key':'X-Nevix-Access-Code']=code;
 if(payload)headers['Content-Type']='application/json';
 const timeout=route.includes('/sync')||route.includes('/admin/catalog')?90000:45000;
 const attempts=method==='GET'?2:1;
 for(let attempt=0;attempt<attempts;attempt++){
  try{
   const response=await fetch(WATCHMODE_BACKEND+route,{method,headers,cache:'no-store',signal:AbortSignal.timeout(timeout),...(payload?{body:JSON.stringify(payload)}:{})});
   let result={};
   try{result=await response.json();}catch(_){}
   if(!response.ok){
    const error=new Error(result.message||((response.status===401||response.status===403)?'Código de acceso incorrecto o sin permisos.':'El servidor privado respondió con HTTP '+response.status+'.'));
    error.status=response.status;error.code=String(result.error||'');
    throw error;
   }
   return result;
  }catch(error){
   const networkError=['TypeError','TimeoutError','AbortError'].includes(String(error?.name||''));
   if(networkError&&attempt+1<attempts){
    await new Promise(resolve=>setTimeout(resolve,1800));
    continue;
   }
   if(networkError)throw new Error((navigator.onLine?'No se pudo establecer conexión con la API privada de NÉVIX TV.':'Tu dispositivo parece estar sin conexión a internet.')+' Comprueba que el servidor Render esté disponible y vuelve a intentarlo. La película original permanece intacta.');
   throw error;
  }
 }
}

async function playPrivateFilm(item){
 if(!privateFamilyCode){await privateFamilyLogin();if(!privateFamilyCode)return;}
 try{
  const result=await privateRequest('/api/private/stream?id='+encodeURIComponent(item.id),privateFamilyCode);
  if(!/^https:\/\//i.test(String(result.url||'')))throw Error('El servidor no devolvió un enlace de reproducción válido.');
  item.privateFallbackUrl=typeof result.fallbackPath==='string'&&/^\/api\/private\/video\?/.test(result.fallbackPath)?WATCHMODE_BACKEND+result.fallbackPath:'';
  item.privateFallbackExpiresIn=Math.max(60,Number(result.fallbackExpiresIn)||900);
  item.privateStandardMp4=Boolean(result.standardMp4);
  const proxyPreferred=Boolean(result.preferProxy||item.privateForceProxy)&&Boolean(item.privateFallbackUrl);
  item.privateProxyActive=proxyPreferred;
  item.url=proxyPreferred?item.privateFallbackUrl:result.url;
  item.privateUrlExpires=Date.now()+Math.max(60,proxyPreferred?item.privateFallbackExpiresIn:(Number(result.expiresIn)||240))*1000;
  play(item.id);
 }catch(e){toast('No se pudo reproducir: '+String(e.message||'Error del servidor.'));}
}

async function preparePrivateManualPoster(file){
 if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>15*1024*1024)throw Error('Selecciona una imagen JPG, PNG o WebP de hasta 15 MB.');
 const url=URL.createObjectURL(file);
 try{
  const img=new Image();img.src=url;await img.decode();
  if(!img.naturalWidth||!img.naturalHeight||img.naturalWidth*img.naturalHeight>40000000)throw Error('La imagen es demasiado grande o no es válida.');
  const canvas=document.createElement('canvas');
  let scale=Math.min(1,600/img.naturalWidth,900/img.naturalHeight);
  for(let attempt=0;attempt<6;attempt++){
   canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
   const ctx=canvas.getContext('2d');if(!ctx)throw Error('No se pudo preparar la portada.');
   ctx.fillStyle='#111111';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);
   const jpeg=canvas.toDataURL('image/jpeg',0.82);
   if(jpeg.startsWith('data:image/jpeg;base64,')&&jpeg.length<=130000)return jpeg;
   scale*=0.75;
  }
  throw Error('No se pudo reducir el tamaño de la portada. Prueba con otra imagen.');
 }finally{URL.revokeObjectURL(url);}
}

function privateFilmNameHint(filename){
 // File objects must be read through .name; String(file) becomes "[object File]".
 const name=typeof filename==='string'?filename:String(filename?.name||'');
 const base=name.replace(/\.(mp4|m4v|mkv|avi|mov|webm|wmv|mpeg|mpg|ts|m2ts)$/i,'')
  .replace(/[._]+/g,' ').replace(/\b(?:1080p|2160p|720p|480p|web[- ]?dl|bluray|brrip|x264|x265|hevc|h264|aac|dts)\b/ig,' ')
  .replace(/\s+/g,' ').trim();
 const year=(base.match(/\b(?:19|20)\d{2}\b/)||[])[0]||'';
 const title=base.replace(/\b(?:19|20)\d{2}\b.*$/,'').replace(/[-\s]+$/,'').trim();
 // Numeric camera filenames do not identify a movie; require the real title.
 if(/^\d{6,}$/.test(title))return {title:'',year:''};
 return {title:(title||base||'').slice(0,130),year};
}

function privatePrepareUploadDrafts(){

 for(const file of picked){
  const token=privateFileToken(file);

const NEVIX_UPLOAD_SESSION_KEY='nevix-r2-mp4-session-v2'; // Sesiones anteriores compatibles
const NEVIX_MULTI_UPLOAD_SESSION_KEY='nevix-r2-multi-sessions-v1';
function privateFileToken(file){return [file.name,file.size,Number(file.lastModified)||0].join('::');}
function privateUploadSessions(){
 try{
  const obj=JSON.parse(sessionStorage.getItem(NEVIX_MULTI_UPLOAD_SESSION_KEY)||localStorage.getItem(NEVIX_MULTI_UPLOAD_SESSION_KEY)||'{}');
  if(!obj||typeof obj!=='object'||Array.isArray(obj))return {};
  return Object.fromEntries(Object.entries(obj).filter(([k,x])=>k.length<300&&x&&/^[a-f0-9-]{36}$/i.test(String(x.id||''))&&Date.now()-Number(x.at)<12600000).slice(-80));
 }catch(_){return {};}
}
function privateStoredUpload(file,legacy=false){
 const entry=privateUploadSessions()[privateFileToken(file)];
 if(entry&&entry.fileName===file.name&&Number(entry.fileSize)===file.size)return entry;
 if(!legacy)return null;
 try{
  const old=JSON.parse(sessionStorage.getItem(NEVIX_UPLOAD_SESSION_KEY)||'null');
  if(old&&old.fileName===file.name&&Number(old.fileSize)===file.size&&/^[a-f0-9-]{36}$/i.test(old.id)&&Date.now()-Number(old.at)<12600000)return old;
 }catch(_){}
 return null;
}
function privateSaveUpload(file,id){
 const obj=privateUploadSessions();
 obj[privateFileToken(file)]={id,fileName:file.name,fileSize:file.size,at:Date.now()};
 try{sessionStorage.setItem(NEVIX_MULTI_UPLOAD_SESSION_KEY,JSON.stringify(obj));localStorage.setItem(NEVIX_MULTI_UPLOAD_SESSION_KEY,JSON.stringify(obj));}catch(_){}
 try{const old=JSON.parse(sessionStorage.getItem(NEVIX_UPLOAD_SESSION_KEY)||'null');if(old?.id===id)sessionStorage.removeItem(NEVIX_UPLOAD_SESSION_KEY);}catch(_){}
}
function privateClearUpload(file){
 const obj=privateUploadSessions();delete obj[privateFileToken(file)];
 try{sessionStorage.setItem(NEVIX_MULTI_UPLOAD_SESSION_KEY,JSON.stringify(obj));localStorage.setItem(NEVIX_MULTI_UPLOAD_SESSION_KEY,JSON.stringify(obj));}catch(_){}
 try{const old=JSON.parse(sessionStorage.getItem(NEVIX_UPLOAD_SESSION_KEY)||'null');if(old?.fileName===file.name&&Number(old?.fileSize)===file.size)sessionStorage.removeItem(NEVIX_UPLOAD_SESSION_KEY);}catch(_){}
}

function privateUploadBatchMarkup(){
 if(!privateBatchUploads.length)return '';
 const labels={queued:'En espera',uploading:'Subiendo',cancelling:'Cancelando',cancelPending:'Cancelación no confirmada',cancelled:'Cancelada',finalizing:'Confirmando en R2',processing:'Convirtiendo o verificando',prepared:'Preparación terminada',stored:'Guardada en R2',review:'Pendiente de revisión',failed:'Interrumpida'};
 return '<div class="panel-card" style="padding:13px"><h3 style="margin:0 0 10px">Estado de las películas</h3><p class="hint" style="margin:0 0 8px">Cancelar detiene solamente la película seleccionada. Eliminar de la lista no borra videos ya guardados en R2.</p>'+
  privateBatchUploads.map(row=>{
   const pct=Math.max(0,Math.min(100,Math.round(Number(row.percent)||0)));
   const id=esc(row.id);

function privateUpdateUploadRow(row,detail,pct,phase){

async function privateSendMp4Part({sessionId,part,piece,key,onProgress,row}){
 if(row?.cancelRequested)throw Error('Se solicitó cancelar la subida.');
 return await new Promise((resolve,reject)=>{
  const xhr=new XMLHttpRequest();
  if(row)row.xhr=xhr;
  const release=()=>{if(row?.xhr===xhr)row.xhr=null;};
  xhr.open('POST',WATCHMODE_BACKEND+'/api/private/upload/part?id='+encodeURIComponent(sessionId)+'&part='+part,true);
  xhr.setRequestHeader('X-Nevix-Admin-Key',key);
  xhr.setRequestHeader('Content-Type','application/octet-stream');
  xhr.timeout=180000;
  xhr.upload.onprogress=event=>{if(!row?.cancelRequested&&event.lengthComputable&&typeof onProgress==='function')onProgress(event.loaded);};
  xhr.onload=()=>{
   release();
   let result={};try{result=JSON.parse(xhr.responseText||'{}');}catch(_){}
   if(row?.cancelRequested)return reject(Error('Subida cancelada por administración.'));
   if(xhr.status>=200&&xhr.status<300&&result.ok&&Number(result.part)===part)return resolve(result);
   const error=Error(result.message||'El servidor rechazó el bloque '+part+' (HTTP '+xhr.status+').');
   error.status=xhr.status;
   error.code=String(result.error||'');
   // A busy part may still be finishing after the browser lost the connection.
   // Do not treat R2 part_busy (409) as a permanent failure.
   error.permanent=[400,401,403,404,413,422].includes(xhr.status)
    ||(xhr.status===409&&error.code!=='part_busy');
   reject(error);
  };
  xhr.onerror=()=>{release();reject(Error('Falló la conexión al enviar el bloque '+part+'. Comprueba Wi-Fi o datos móviles.'));};
  xhr.ontimeout=()=>{release();reject(Error('El bloque '+part+' superó el tiempo de conexión.'));};
  xhr.onabort=()=>{release();reject(Error('La transferencia del bloque '+part+' fue detenida.'));};
  xhr.send(piece);
  if(row?.cancelRequested)try{xhr.abort();}catch(_){}
 });
}
async function privateWatchAutomaticMovie(key,started,onUpdate){
 let jobId=String(started.jobId||''),movieId=String(started.movieId||''),errors=0;
 const update=msg=>{onUpdate(msg);};
 const phases={queued:'Preparación en cola',downloading:'Analizando video en R2',remuxing:'Verificando o reparando el MP4',uploading:'Guardando copia compatible',indexing:'Publicando película',completed:'Verificación completa',failed:'Verificación fallida'};
 for(let n=0;n<240;n++){
  let result=null;
  try{
   result=await privateRequest('/api/private/remux/status?jobId='+encodeURIComponent(jobId),key,true);
   errors=0;
  }catch(error){
   errors++;
   try{
    const library=await privateRequest('/api/private/admin/library',key,true);
    const original=(library.files||[]).find(x=>x.id===movieId);
    if(original?.status==='processing_failed'){
     update('Verificación incompleta: '+String(original.validationError||'El MP4 necesita revisión.')+'. El archivo original se conserva.');return false;
    }
    if(original?.status==='backup'||(original?.verified&&original?.status!=='processing')){
     update('La película ya fue verificada y preparada en Cloudflare R2.');return true;
    }
    if(original?.job?.jobId){jobId=original.job.jobId;errors=0;}
   }catch(_){}
   if(errors>=12){
    update('No se pudo consultar el estado en Render. El archivo MP4 está guardado; abre «Administrar y eliminar películas de R2» para comprobar su verificación. No necesitas volver a subirlo.');
    return false;
   }
   update('Película guardada en R2. Recuperando el estado de verificación ('+errors+'/12)…');
   await new Promise(resolve=>setTimeout(resolve,5000));
   continue;
  }
  const phase=phases[result.phase]||'Preparando película';
  update(phase+' · '+(Math.max(0,Math.min(100,Number(result.percent)||0)))+' % · '+String(result.message||''));
  if(result.completed){
   try{
    const data=await privateRequest('/api/private/admin/catalog',key,true);
    const pending=(data.items||[]).filter(x=>['review','new'].includes(x.status));
    if(pending.length){
     update('Video preparado en MP4 compatible. Falta identificar el título y la portada.');
     await privateReviewAdmin();
    }else{
     update('Video verificado en formato MP4 compatible. Ya puedes probarlo en NÉVIX TV.');
    }
   }catch(_){update('Video preparado y verificado. Actualiza el catálogo de Películas.');}
   if(privateFamilyCode)await loadPrivateMovies();
   return true;
  }
  if(result.failed){
   update('La verificación no pudo completarse: '+String(result.message||'Comprueba el MP4.')+'. El original sigue almacenado y no se publicará hasta corregirlo.');
   return false;
  }
  await new Promise(resolve=>setTimeout(resolve,5000));
 }
 update('El MP4 sigue pendiente de confirmación. Su archivo está guardado; revisa su estado desde Administración.');
 return false;
}

async function privateFinalizeCancelledUpload(row){
 if(row.cancelPromise)return row.cancelPromise;
 row.cancelPromise=(async()=>{
  if(row.removed)return;
  const id=String(row.sessionId||'');
  if(!id){
   // A cancelled queued movie has no server-side multipart data to release.
   if(row.waitingStart)return;
  }else{
   let completed=false;
   for(let attempt=0;attempt<14;attempt++){
    try{
     const result=await privateRequest('/api/private/upload/abort',row.uploadKey,true,'POST',{uploadId:id});
     if(result.cancelled){completed=true;break;}
     if(!result.cancelPending)throw Error('R2 no confirmó la cancelación.');
    }catch(e){
     if(attempt>=13)throw e;
     if(/finaliz|ya no está activa|no está activa/i.test(String(e?.message||'')))throw e;
    }
    await new Promise(resolve=>setTimeout(resolve,1200));
   }
   if(!completed)throw Error('R2 no confirmó que la sesión se haya eliminado.');
  }
  privateForgetUploadRow(row);
  row.sessionId='';row.waitingStart=false;row.file=null;row.xhr=null;
  row.cancelRequested=true;
  privateUpdateUploadRow(row,'Subida cancelada y bloques incompletos liberados de Cloudflare R2.',row.percent,'cancelled');
  if(row.removeAfterCancel)privateDropUploadRow(row);
 })().catch(e=>{
  row.phase='cancelPending';
  row.detail='Cancelación aún sin confirmar: '+String(e?.message||'Intenta nuevamente.')+'. No se enviarán más bloques de esta película.';
  privateRenderUploadBatch(true);
 }).finally(()=>{row.cancelPromise=null;});
 return row.cancelPromise;
}
async function privateCancelUploadRow(id,removeAfter=false){

  if(removeAfter&&!confirm('¿Quitar esta película de la lista de subidas? No se eliminará de Cloudflare R2.'))return;
  if(removeAfter)row.removeAfterCancel=true;
  if(!removeAfter){toast('Este archivo ya está en Cloudflare R2. Para eliminarlo, utiliza Gestionar títulos, portadas y películas.');return;}

 }

 }
 if(row.phase==='cancelled'){
  if(removeAfter)privateDropUploadRow(row);

 }
 if(row.phase==='failed'&&!row.sessionId&&!row.waitingStart){
  if(removeAfter)row.removeAfterCancel=true;
  privateForgetUploadRow(row);
  row.cancelRequested=true;row.file=null;
  privateUpdateUploadRow(row,'Subida retirada. No queda una sesión activa en esta página.',row.percent,'cancelled');
  if(removeAfter)privateDropUploadRow(row);

 }
 if(!row.cancelRequested&&!confirm('¿Cancelar la subida de «'+row.name+'»? Solo se detendrá este archivo; las otras películas seguirán subiendo.'))return;
 if(removeAfter)row.removeAfterCancel=true;

 if(row.phase==='queued'){

 }
 privateUpdateUploadRow(row,'Cancelando la transferencia y liberando los bloques en R2…',row.percent,'cancelling');

 if(row.sessionId)await privateFinalizeCancelledUpload(row);

}
async function privateUploadOneFilm(file,key,row,allowLegacy=false){
 let sessionId='';

  if(row.cancelRequested)throw Error('Cancelación solicitada.');
  privateUpdateUploadRow(row,'Conectando con Cloudflare R2…',0,'uploading');
  let upload=null,received=new Set();
  const previous=privateStoredUpload(file,allowLegacy);
  if(previous){
   try{
    const progress=await privateRequest('/api/private/upload/progress?id='+encodeURIComponent(previous.id),key,true);
    if(progress?.uploadId===previous.id&&progress.name===file.name&&Number(progress.size)===file.size){
     upload={uploadId:progress.uploadId,chunkSize:progress.chunkSize,chunks:progress.chunks};
     if(progress.title)row.title=progress.title;
     if(progress.year)row.year=progress.year;
     received=new Set((progress.receivedParts||[]).map(Number).filter(Number.isSafeInteger));
     privateUpdateUploadRow(row,'Se recuperaron '+received.size+' bloques de esta subida.',Math.min(99,Math.floor(received.size*Number(upload.chunkSize)/file.size*100)),'uploading');
    }else{
     if(progress?.uploadId===previous.id&&Number(progress.size)===file.size){
      // The object name may be sanitized by the backend; size and exact
      // stored session token are sufficient to resume the same file.
      upload={uploadId:progress.uploadId,chunkSize:progress.chunkSize,chunks:progress.chunks};
      if(progress.title)row.title=progress.title;
      if(progress.year)row.year=progress.year;
      received=new Set((progress.receivedParts||[]).map(Number).filter(Number.isSafeInteger));
      privateUpdateUploadRow(row,'Recuperados '+received.size+' bloques confirmados en Cloudflare R2.',Math.min(99,Math.floor(received.size*Number(upload.chunkSize)/file.size*100)),'uploading');
     }else{
      privateClearUpload(file);
      privateUpdateUploadRow(row,'La sesión anterior no coincide con el archivo. Se iniciará desde cero.',0,'uploading');
     }
    }
   }catch(error){
    if(error?.status===401||error?.status===403)throw error;
    if(error?.status===404){
     privateClearUpload(file);
     privateUpdateUploadRow(row,'La sesión anterior fue cancelada o caducó en R2. El archivo se reiniciará desde 0 % porque esos bloques ya no existen.',0,'uploading');
    }else{
     // A temporary failure checking progress is not proof that the
     // multipart session has disappeared. Keep the session for retry.
     throw new Error('No se pudo consultar el progreso guardado en R2. Reintenta Continuar subida cuando vuelva la conexión. '+String(error?.message||''));
    }
   }
  }

   privateUpdateUploadRow(row,'Iniciando una nueva subida desde cero…',0,'uploading');
   // An older upload may still be occupying an R2 slot. 429 is temporary:
   // wait for a free slot instead of marking the movie interrupted at 0%.
   for(let attempt=1;attempt<=12;attempt++){
    if(row.cancelRequested)throw Error('Cancelación solicitada.');
    try{
     upload=await privateRequest('/api/private/upload/start',key,true,'POST',{name:file.name,size:file.size,title:row.title||'',year:row.year||'',...(row.manualPoster?{manualPoster:row.manualPoster}:{})});
     break;
    }catch(error){
     if(error?.status!==429||attempt===12)throw error;
     privateUpdateUploadRow(row,'Esperando un espacio de subida disponible en R2 ('+attempt+'/12). No se ha perdido ningún archivo.',0,'uploading');
     await new Promise(resolve=>setTimeout(resolve,Math.min(15000,2500*attempt)));
    }

  }

   if(row.cancelRequested)throw Error('Cancelación solicitada.');
   const from=(part-1)*size,to=Math.min(file.size,from+size);
   if(received.has(part)){confirmed+=to-from;privateUpdateUploadRow(row,'Retomando bloques existentes…',Math.min(99,Math.floor(confirmed/file.size*100)),'uploading');continue;}

   for(let attempt=1;attempt<=8&&!delivered;attempt++){

    try{
     await privateSendMp4Part({sessionId,part,piece:file.slice(from,to),key,row,onProgress:n=>privateUpdateUploadRow(row,'Subiendo bloque '+part+' de '+total,Math.min(99,Math.floor((confirmed+n)/file.size*100)),'uploading')});

       privateUpdateUploadRow(row,'Bloque '+part+' recuperado desde el progreso confirmado en R2.',Math.min(99,Math.floor((confirmed+(to-from))/file.size*100)),'uploading');

      }
     }catch(checkError){

       error=checkError?.status===404?new Error('La sesión fue cancelada o caducó en R2; sus bloques ya no pueden retomarse. Reinicia esta película desde cero.'):checkError;
       error.permanent=true;

      }
     }

     if(attempt<8){
      privateUpdateUploadRow(row,'Conexión interrumpida o bloque ocupado. Esperando para retomar bloque '+part+' sin perder los anteriores…',Math.min(99,Math.floor(confirmed/file.size*100)),'uploading');

  if(!done?.stored)throw Error('R2 todavía no confirmó la película completa.');
  sessionId='';row.sessionId='';privateClearUpload(file);
  if(done.autoProcessing&&done.jobId){
   privateUpdateUploadRow(row,'Guardada. Esperando verificación o conversión automática a MP4…',100,'processing');

   void privateWatchAutomaticMovie(key,done,message=>privateUpdateUploadRow(row,message,null,'processing'))
    .then(ok=>privateUpdateUploadRow(row,null,100,ok?'prepared':'review'))

  }else if(done.validationError)privateUpdateUploadRow(row,'Guardada; la preparación requiere revisión: '+String(done.validationError),100,'review');

 }catch(e){
  row.waitingStart=false;
  if(row.cancelRequested)await privateFinalizeCancelledUpload(row);
  else privateUpdateUploadRow(row,'Subida interrumpida: '+String(e?.message||'Error.')+(sessionId?' Vuelve a seleccionar este archivo para reanudar sus bloques.':''),row.percent,'failed');

}

async function privateRetryUpload(id){
 const row=privateBatchUploads.find(x=>x.id===String(id||''));
 if(!row||row.phase!=='failed'||row.cancelRequested||row.retrying)return;
 if(!row.file)return toast('Vuelve a seleccionar el mismo archivo para recuperar sus bloques confirmados.');

  privateUpdateUploadRow(row,'Consultando los bloques guardados para reanudar…',row.percent,'queued');

async function privateDrainUploadQueue(){

   for(;;){

    if(!row)break;

     if(row.file&&!row.cancelRequested)await privateUploadOneFilm(row.file,row.uploadKey,row,Boolean(row.allowLegacy));

  const opened=()=>{mediaSource.removeEventListener('error',failed);resolve();};
  const failed=()=>{mediaSource.removeEventListener('sourceopen',opened);reject(Error('El navegador rechazó el reproductor multimedia.'));};
  mediaSource.addEventListener('sourceopen',opened,{once:true});
  mediaSource.addEventListener('error',failed,{once:true});
 });
 const append=bytes=>new Promise((resolve,reject)=>{
  if(!active)return reject(Error('Reproducción cancelada.'));
  const done=()=>{sourceBuffer.removeEventListener('error',fail);resolve();};
  const fail=()=>{sourceBuffer.removeEventListener('updateend',done);reject(Error('El reproductor no pudo interpretar los fragmentos MP4.'));};
  sourceBuffer.addEventListener('updateend',done,{once:true});
  sourceBuffer.addEventListener('error',fail,{once:true});
  try{sourceBuffer.appendBuffer(bytes);}catch(e){
   sourceBuffer.removeEventListener('updateend',done);
   sourceBuffer.removeEventListener('error',fail);
   reject(Error(e?.name==='QuotaExceededError'?'El buffer del dispositivo se llenó.':'No se pudo procesar el video fragmentado.'));
  }
 });
 const bufferAhead=()=>{
  try{
   for(let i=0;i<video.buffered.length;i++){
    if(video.buffered.start(i)<=video.currentTime+0.5&&video.buffered.end(i)>=video.currentTime)
     return video.buffered.end(i)-video.currentTime;
   }
  }catch(_){}
  return 0;
 };
 const readBox=(bytes,position)=>{
  if(position+8>bytes.length)return null;
  const view=new DataView(bytes.buffer,bytes.byteOffset+position);
  let size=view.getUint32(0),header=8;
  const type=String.fromCharCode(...bytes.subarray(position+4,position+8));
  if(size===1){
   if(position+16>bytes.length)return null;
   const upper=view.getUint32(8),lower=view.getUint32(12);
   size=upper*4294967296+lower;
   header=16;
  }
  if(!size||!Number.isSafeInteger(size)||size<header||size>20*1024*1024)
   throw Error('El contenedor MP4 tiene un segmento demasiado grande o inválido.');
  return {type,size,end:position+size,complete:position+size<=bytes.length};
 };
 const findInitEnd=bytes=>{
  let offset=0,seenFtyp=false;
  for(let n=0;n<24&&offset<bytes.length;n++){
   const box=readBox(bytes,offset);
   if(!box||!box.complete)throw Error('No se recibió completa la cabecera inicial del MP4.');
   if(box.type==='ftyp')seenFtyp=true;
   if(box.type==='moov'&&seenFtyp)return box.end;
   if(box.type==='moof')throw Error('Falta la inicialización moov del video.');
   offset=box.end;
  }
  throw Error('No se encontró la información de inicio del MP4.');
 };
 const run=async()=>{
  onStatus('Preparando el MP4 fragmentado…');
  // Probe the initialization structure separately. Do not append partial media boxes.
  const first=await rangeFetch(0,65535);
  const total=first.total;
  if(!Number.isSafeInteger(total)||total<65536)throw Error('El archivo no tiene un tamaño válido.');
  const initEnd=findInitEnd(first.bytes);
  const mime=codecFromInit(first.bytes.subarray(0,initEnd));
  if(!active)return;
  mediaSource=new MSE();
  objectUrl=URL.createObjectURL(mediaSource);
  video.src=objectUrl;
  video.load();
  await waitOpen();
  if(!active)return;
  sourceBuffer=mediaSource.addSourceBuffer(mime);
  sourceBuffer.mode='segments';
  await append(first.bytes.slice(0,initEnd)); // ftyp + moov only
  offset=first.bytes.length;
  let carry=first.bytes.slice(initEnd);
  let processed=0;
  onStatus('Cargando los segmentos de imagen y sonido…');
  const drain=async()=>{
   let position=0,completedThrough=0,moofSeen=false,segments=[];
   while(position<carry.length){
    const box=readBox(carry,position);
    if(!box||!box.complete)break;
    if(box.type==='moof'){
     if(moofSeen)throw Error('El MP4 contiene un fragmento incompleto.');
     moofSeen=true;
    }else if(box.type==='mdat'){
     if(!moofSeen)throw Error('El MP4 contiene datos sin su encabezado moof.');
     segments.push(carry.slice(completedThrough,box.end));
     completedThrough=box.end;moofSeen=false;
    }
    position=box.end;
   }
   for(const bytes of segments){
    if(!active)return;
    await append(bytes);
    processed+=bytes.length;
   }
   if(completedThrough)carry=carry.slice(completedThrough);
  };
  await drain();
  if(!active)return;
  const tryStart=()=>video.play().catch(e=>{
   if(e?.name==='NotAllowedError')onStatus('Pulsa reproducir para comenzar la película.');
  });
  void tryStart();
  while(active&&offset<total){
   if(bufferAhead()>40){await sleep(400);continue;}
   if(sourceBuffer.updating){await sleep(60);continue;}
   // Keep memory bounded while retaining enough fragments for seeking backward.
   if(video.currentTime>75&&sourceBuffer.buffered.length){
    const cut=video.currentTime-35;
    if(sourceBuffer.buffered.start(0)<cut-15){
     await new Promise(resolve=>{
      sourceBuffer.addEventListener('updateend',resolve,{once:true});
      try{sourceBuffer.remove(sourceBuffer.buffered.start(0),cut);}catch(_){resolve();}
     });
    }
   }
   const part=await rangeFetch(offset,Math.min(total-1,offset+CHUNK-1));
   if(!active)return;
   const joined=new Uint8Array(carry.length+part.bytes.length);
   joined.set(carry,0);joined.set(part.bytes,carry.length);
   carry=joined;offset+=part.bytes.length;
   if(carry.length>24*1024*1024)throw Error('Un segmento MP4 sobrepasó el límite del reproductor.');

   if(!active)return;
   if(offset>=18*1024*1024&&video.buffered.length===0&&video.currentTime<0.1)
    throw Error('El navegador no pudo decodificar el MP4. Puede necesitar una conversión de contenedor, sin perder calidad.');
  }
  await drain();
  if(active&&mediaSource.readyState==='open'&&!sourceBuffer.updating){
   try{mediaSource.endOfStream();}catch(_){}
  }
 };

  if(!active||e?.name==='AbortError')return;
  session.cancel();
  onError(e?.message||'No se pudo reproducir el video fragmentado.');
 });

}

function setPrivateAudio(mode,remember=false){

 if(!ctx||state.playing!==ctx.id)return;
 const {audio,video,select,label}=ctx;
 if(mode!=='es'||!ctx.url){
  ctx.mode='original';audio.pause();video.muted=false;
  if(select)select.value='original';
  if(label)label.textContent=ctx.url?'Audio original seleccionado.':'Audio original: español aún no disponible.';
  if(remember)try{localStorage.setItem('nevix-preferred-audio','original');}catch(_){}
  return;
 }
 ctx.mode='es';
 video.muted=true;
 if(audio.src!==ctx.url){audio.src=ctx.url;audio.load();}
 audio.playbackRate=video.playbackRate||1;
 try{if(Number.isFinite(video.currentTime))audio.currentTime=video.currentTime;}catch(_){}
 if(select)select.value='es';
 if(label)label.textContent='Español latino (doblaje con IA).';
 if(remember)try{localStorage.setItem('nevix-preferred-audio','es');}catch(_){}
 if(!video.paused){
  const p=audio.play();
  if(p?.catch)p.catch(()=>{if(privateAudioContext===ctx){setPrivateAudio('original');if(label)label.textContent='Pulsa Español latino otra vez para activar el audio.';}});
 }
}

window.addEventListener('hashchange',()=>{const requested=location.hash.slice(1);if(requested==='netflix'||requested==='free'){go('movie');return;}if(NAMES[requested]&&requested!==state.view){state.view=requested;state.category='Todos';state.search='';render();if(requested==='movie'&&!state.movieAttempted)void loadWatchmodeCatalog();if(requested==='series'&&!state.seriesAttempted)void loadWatchmodeSeries();}});

/* NÉVIX: preferencia global del catálogo externo, almacenada en R2. */
let netflixCatalogEnabled=false,netflixSettingsLoaded=false,netflixSettingsSaving=false;
let netflixSettingsRequest=null,netflixSettingsRevision=0;
function isNetflixCatalogItem(it){
 if(!it||it.kind==='live'||it.privateMovie)return false;
 return it.watchmode===true||it.netflix===true||
  /^https:\/\/(?:www\.)?netflix\.com\//i.test(String(it.url||''))||
  /netflix/i.test(String(it.source||''));
}
const oldMovieCatalogItems=movieCatalogItems;
movieCatalogItems=function(){return oldMovieCatalogItems().filter(it=>netflixCatalogEnabled||!isNetflixCatalogItem(it));};
const oldSeriesCatalogItems=seriesCatalogItems;
seriesCatalogItems=function(){return oldSeriesCatalogItems().filter(it=>netflixCatalogEnabled||!isNetflixCatalogItem(it));};
const oldAllItems=allItems;
allItems=function(){return oldAllItems().filter(it=>netflixCatalogEnabled||!isNetflixCatalogItem(it));};
const oldRenderCatalog=renderCatalog;
renderCatalog=function(kind){
 if(netflixCatalogEnabled)return oldRenderCatalog(kind);
 const own=allItems().filter(it=>it.kind===kind&&!it.privateMovie);
 const q=kind==='movie'?state.movieQuery:state.seriesQuery;
 const result=chooseItems(kind==='series'?seriesOnce(own):own,{q});
 const field=kind==='movie'?'movie-search':'series-search';
 const word=kind==='movie'?'películas':'series';
 return pageTitle(kind==='movie'?'Películas':'Series','Disfruta de las películas y series de tu biblioteca NÉVIX.')
  +'<div class="live-tools"><label class="live-search-label">⌕ <input type="search" id="'+field+'" value="'+esc(q)+'" placeholder="Buscar '+word+'…" autocomplete="off"></label></div>'
  +(kind==='movie'?privateFilmRail():'')
  +(result.length?'<section class="catalog-rail"><div class="section-head"><h2>Mi biblioteca</h2></div><div class="tile-grid">'+result.map(it=>card(it,true)).join('')+'</div></section>':(kind==='series'||!privateMovies.length?'<p class="hint">'+(kind==='movie'?'Inicia sesión con tu código familiar o pulsa Volver a cargar para consultar las películas guardadas.':(normalizeCatalogSearch(q)?'No se encontraron series para esta búsqueda.':'Por ahora no hay series disponibles.'))+'</p>':''));
};
const oldLoadWatchmodeCatalog=loadWatchmodeCatalog;
loadWatchmodeCatalog=function(){if(netflixCatalogEnabled)return oldLoadWatchmodeCatalog();};
const oldLoadWatchmodeSeries=loadWatchmodeSeries;
loadWatchmodeSeries=function(){if(netflixCatalogEnabled)return oldLoadWatchmodeSeries();};
const oldLoadWatchmodeSection=loadWatchmodeSection;
loadWatchmodeSection=function(section,next){if(netflixCatalogEnabled)return oldLoadWatchmodeSection(section,next);};
const oldLoadWatchmodeSeriesSection=loadWatchmodeSeriesSection;
loadWatchmodeSeriesSection=function(section,next){if(netflixCatalogEnabled)return oldLoadWatchmodeSeriesSection(section,next);};
const oldOpenWatchmodeTitle=openWatchmodeTitle;
openWatchmodeTitle=function(it){if(!netflixCatalogEnabled)return toast('Este catálogo está desactivado.');return oldOpenWatchmodeTitle(it);};
const oldRenderHome=renderHome;
renderHome=function(){
 if(netflixCatalogEnabled)return oldRenderHome();
 const oldMovies=state.movieRecentItems,oldPopular=state.moviePopularItems,oldSeries=state.seriesRecentItems,oldSeriesPopular=state.seriesPopularItems;
 // El render original solo utiliza estos arreglos para recomendaciones externas.
 state.movieRecentItems=[];state.moviePopularItems=[];state.seriesRecentItems=[];state.seriesPopularItems=[];
 try{
  let page=oldRenderHome();
  page=page.replace(/<p class="hint">Las películas y series se abren en sus proveedores oficiales; algunas requieren una suscripción\.[\s\S]*?<\/p><\/div>$/,'<p class="hint">Las señales de TV dependen de la disponibilidad del emisor.</p></div>');
  return page;
 }finally{
  state.movieRecentItems=oldMovies;state.moviePopularItems=oldPopular;state.seriesRecentItems=oldSeries;state.seriesPopularItems=oldSeriesPopular;
 }
};
function refreshNetflixAdmin(message=''){
 const input=document.getElementById('netflix-catalog-switch');
 if(input){input.checked=netflixCatalogEnabled;input.disabled=!netflixSettingsLoaded||netflixSettingsSaving;}
 const label=document.getElementById('netflix-catalog-state');
 if(label)label.textContent=message||(!netflixSettingsLoaded?'Configuración no disponible; Netflix oculto.':netflixSettingsSaving?'Guardando…':netflixCatalogEnabled?'Netflix activado: catálogo y series visibles.':'Netflix desactivado: películas, series y rankings ocultos.');
}
function applyNetflixSetting(enabled){
 enabled=Boolean(enabled);
 const changed=enabled!==netflixCatalogEnabled;
 netflixCatalogEnabled=enabled;
 if(changed){
  state.movieRecentItems=[];state.moviePopularItems=[];state.seriesRecentItems=[];state.seriesPopularItems=[];
  state.movieAttempted=false;state.seriesAttempted=false;
  state.movieLoading={recent:false,popular:false};state.seriesLoading={recent:false,popular:false};
  state.moviePage={recent:0,popular:0};state.seriesPage={recent:0,popular:0};
  state.movieTotalPages={recent:0,popular:0};state.seriesTotalPages={recent:0,popular:0};
  state.movieError='';state.seriesError='';
  try{localStorage.removeItem(CATALOG_CACHE_KEY);}catch(_){}
  if(state.selected&&!itemById(state.selected))closeDetail();
  if(state.view!=='admin')render();
  if(enabled){
   if(state.view==='inicio'||state.view==='movie')loadWatchmodeCatalog();
   if(state.view==='inicio'||state.view==='series')loadWatchmodeSeries();
  }
 }
 refreshNetflixAdmin();
}
async function loadNetflixSettings(){
 if(netflixSettingsSaving)return;
 if(netflixSettingsRequest)return netflixSettingsRequest;
 const version=netflixSettingsRevision;
 netflixSettingsRequest=(async()=>{
  try{
   const response=await fetch(WATCHMODE_BACKEND+'/api/private/netflix-settings',{cache:'no-store',signal:AbortSignal.timeout(15000)});
   const data=await response.json();
   if(!response.ok||typeof data.enabled!=='boolean')throw Error('Estado no disponible');
   if(version!==netflixSettingsRevision||netflixSettingsSaving)return;
   netflixSettingsLoaded=true;applyNetflixSetting(data.enabled);
  }catch(_){
   if(version!==netflixSettingsRevision||netflixSettingsSaving)return;
   netflixSettingsLoaded=false;applyNetflixSetting(false);
   refreshNetflixAdmin('No se pudo consultar la configuración. Netflix permanece oculto.');
  }
 })().finally(()=>{netflixSettingsRequest=null;});
 return netflixSettingsRequest;
}
async function saveNetflixSettings(enabled){
 if(netflixSettingsSaving)return;
 const key=document.getElementById('private-admin-key')?.value?.trim()||'';
 if(!key){refreshNetflixAdmin();toast('Introduce el código de administración para cambiar Netflix.');return;}
 netflixSettingsSaving=true;netflixSettingsRevision++;refreshNetflixAdmin();
 try{
  const result=await privateRequest('/api/private/netflix-settings',key,true,'POST',{enabled:Boolean(enabled)});
  if(result?.ok!==true||result.enabled!==Boolean(enabled))throw Error('Cambio no confirmado');
  netflixSettingsSaving=false;netflixSettingsLoaded=true;applyNetflixSetting(result.enabled);
  toast(enabled?'Netflix activado para todos los dispositivos.':'Netflix desactivado para todos los dispositivos.');
 }catch(e){
  netflixSettingsSaving=false;refreshNetflixAdmin('No se confirmó el cambio: '+String(e?.message||'Error')+'.');
  toast('No se pudo guardar la preferencia. Comprueba la conexión y el código.');
  void loadNetflixSettings();
 }
}

// No se registra un service worker: evita recibir versiones antiguas de la interfaz.
if(!saved){try{localStorage.setItem(DB,JSON.stringify({items:state.items,favorites:state.favorites,progress:state.progress,pinHash:state.pinHash,worldChannels:state.worldChannels.slice(0,1800),loadedCountries:state.loadedCountries}));}catch(_){}}const initial=location.hash.slice(1);state.view=initial==='netflix'||initial==='free'?'movie':NAMES[initial]?initial:'inicio';if(initial==='netflix'||initial==='free')location.hash='movie';render();void loadChannelLogos();void loadNetflixSettings();
void privateCheckStatus();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')void loadNetflixSettings();});
setInterval(()=>{if(document.visibilityState==='visible')void loadNetflixSettings();},45000);
setInterval(()=>{if(document.visibilityState!=='visible'||state.playing||visibleYoutubeCheck||homePreviewActive||activeCountryLoad||!['inicio','live','favorites','search'].includes(state.view))return;const now=Date.now(),expired=state.worldChannels.some(x=>!isVerifiedLive(x,now))||Object.values(youtubeProof).some(x=>!Number.isFinite(x?.testedAt)||now-x.testedAt>=LIVE_PROOF_TTL);if(expired){state.worldChannels=state.worldChannels.filter(x=>isVerifiedLive(x,now));for(const [id,p] of Object.entries(youtubeProof))if(!Number.isFinite(p?.testedAt)||now-p.testedAt>=LIVE_PROOF_TTL)delete youtubeProof[id];persistYoutubeProof();store();render();}},30000);
if(privateFamilyCode)void loadPrivateMovies();
setInterval(()=>{if(privateFamilyCode&&document.visibilityState==='visible')void loadPrivateMovies();},180000);
