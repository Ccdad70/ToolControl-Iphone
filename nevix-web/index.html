function parseM3U(text, source='M3U importada') {

    const line = lineRaw.trim();

      const image = line.match(/tvg-logo\s*=\s*["']([^"']*)["']/i);
      const comma = line.indexOf(',');

        title: comma < 0 ? 'Canal' : line.slice(comma+1).trim() || 'Canal',
        category: fields?.[1] || 'General', image: image?.[1] || ''

    } else if (line && !line.startsWith('#')) {
      if (validStreamUrl(line)) {

          category: meta?.category || 'General', image: meta?.image || '', url:line,
          source}, {allowDemo:false});

      }

    && (category === 'Todos' || item.category === category)
    && (!query || [item.title,item.category,item.description,item.seriesName]
      .some(part => String(part || '').toLocaleLowerCase('es').includes(query))));
}

function uniqueHash(str){let n=2166136261;for(let i=0;i<str.length;i++){n^=str.charCodeAt(i);n=Math.imul(n,16777619);}return (n>>>0).toString(36);}

function parseCountryPlaylist(text,country){
 // Señales oficiales y comunitarias con estado verified para todos los países; la lista comunitaria blanca se aplica únicamente a Venezuela.
 if(typeof text!=='string'||text.length>3000000)throw Error('Lista demasiado grande');
 const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/);
 const items=[]; const seen=new Set();
 for(let i=0;i<lines.length-1;i++){
  const meta=lines[i].trim();
  if(!meta.startsWith('#EXTINF:'))continue;
  const community=/x-tier\s*=\s*["']community["']/i.test(meta);
  /* community status verified is allowed for all countries; a browser video probe is still required */
  if(community&&!/x-status\s*=\s*["']verified["']/i.test(meta))continue;
  if(/x-status\s*=\s*["'](?:restricted|unreachable|invalid|intermittent|unknown)["']/i.test(meta))continue;
  const url=String(lines[i+1]||'').trim();
  if(!/^https:\/\//i.test(url)||!/\.m3u8(?:[?#]|$)/i.test(url)||seen.has(url))continue;
  const title=meta.slice(meta.indexOf(',')+1).trim()||'Canal gratuito';
  if(country[0]==='ve'&&REMOVED_VE_CHANNELS.test(title.normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim()))continue;
  if(country[0]==='ve'&&community&&!/^(?:Telesur(?: \(English HD\))?|TVes|PromarTV|ShowVen TV|Televisora de Oriente|Vepaco TV|Catatumbo TV|Grande TV|Isla TV|TVS|Canal C del Zulia|Tu TV|BTA TV)$/i.test(title))continue;
  if(/\b(adult|xxx|porn|casino|gambling)\b/i.test(title))continue;
  if(community&&/^(?:canal 11|sport\s*tv|sky\s*sports|hbo|max premium|disney\s*channel)(?:\b|\s|$)/i.test(title))continue;
  seen.add(url);
  const group=(meta.match(/group-title\s*=\s*["']([^"']+)["']/i)||[])[1]||'TV gratuita';
  const source=(community?'Nexonic comunidad verificada · ':'Nexonic oficial · ')+country[2];
  const description=community?'Emisión gratuita listada como comunidad verificada por Nexonic. NÉVIX comprueba si el manifiesto HLS es accesible desde tu Samsung; la inserción puede depender del emisor.':'Señal publicada gratuitamente por su emisor; NÉVIX comprueba el manifiesto HLS antes de mostrarla.';
  const item=normalizeItem({kind:'live',title,short:title,category:country[1]+' '+country[2],url,source,description,direct:true,unverified:community});
  if(item)items.push({...item,id:'official-'+country[0]+'-'+uniqueHash(url),flag:country[1],short:title,genre:group,verifiedManifest:false,source,countryCode:country[0],direct:true,unverified:community});
 }
 // Mostrar primero noticias y canales generales, sin presumir que los otros son de pago.
 items.sort((a,b)=>{const rank=x=>/news|noticias|general|public|cultura|educa/i.test(x.genre||'')?0:1;return rank(a)-rank(b);});
 return items.slice(0,48);
}
async function checkBrowserStream(it, signal){
 // Una comprobación lenta nunca debe bloquear la selección de otro país.
 if(signal?.aborted)return false;
 const ctrl=new AbortController();
 const cancelManifest=()=>ctrl.abort();
 signal?.addEventListener('abort',cancelManifest,{once:true});
 const manifestTimeout=setTimeout(()=>ctrl.abort(),4500);
 try{
  const response=await fetch(it.url,{mode:'cors',credentials:'omit',cache:'no-store',signal:ctrl.signal,redirect:'follow'});
  if(!response.ok)return false;
  const txt=await response.text();
  if(!txt.trimStart().startsWith('#EXTM3U')||txt.length>500000)return false;
 }catch(_){return false;}
 finally{
  clearTimeout(manifestTimeout);
  signal?.removeEventListener('abort',cancelManifest);
 }
 if(signal?.aborted)return false;
 // La reproducción se comprueba sin mostrar controles ni mensajes técnicos.
 return await new Promise(resolve=>{
  const holder=document.createElement('div');
  holder.setAttribute('aria-hidden','true');
  holder.style.cssText='position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none;overflow:hidden;z-index:-1';
  const video=document.createElement('video');
  video.setAttribute('muted','');video.muted=true;video.defaultMuted=true;
  video.setAttribute('playsinline','');video.playsInline=true;
  video.autoplay=true;video.preload='auto';
  holder.appendChild(video);document.body.appendChild(holder);
  let hls=null,ended=false,confirmedTimer=null;
  const finish=ok=>{
   if(ended)return;
   ended=true;clearTimeout(t);clearTimeout(confirmedTimer);
   signal?.removeEventListener('abort',cancelVideo);
   try{video.pause();}catch(_){}
   try{hls?.destroy();}catch(_){}
   try{video.removeAttribute('src');video.load();}catch(_){}
   holder.remove();resolve(Boolean(ok));
  };
  const cancelVideo=()=>finish(false);
  const confirmed=()=>{if(!ended&&!video.paused&&video.readyState>=2&&video.videoWidth>16&&video.videoHeight>16)finish(true);};
  const t=setTimeout(()=>finish(false),8500);
  signal?.addEventListener('abort',cancelVideo,{once:true});
  if(signal?.aborted){finish(false);return;}
  video.addEventListener('playing',()=>{confirmed();if(!ended)confirmedTimer=setTimeout(confirmed,600);});
  video.addEventListener('timeupdate',confirmed);
  video.addEventListener('loadeddata',()=>{if(!ended&&video.readyState>=2&&!video.paused)confirmed();});
  video.addEventListener('error',()=>finish(false));
  video.addEventListener('encrypted',()=>finish(false));
  try{
   const lib=window.Hls;
   if(lib?.isSupported?.()){
    hls=new lib({enableWorker:true,lowLatencyMode:true,maxBufferLength:4,maxMaxBufferLength:6,fragLoadingMaxRetry:1,manifestLoadingMaxRetry:1,levelLoadingMaxRetry:1});
    hls.on(lib.Events.MEDIA_ATTACHED,()=>{if(!ended)hls.loadSource(it.url);});
    hls.on(lib.Events.MANIFEST_PARSED,()=>{if(!ended)video.play().catch(()=>finish(false));});
    hls.on(lib.Events.ERROR,(_event,data)=>{if(data?.fatal)finish(false);});
    hls.attachMedia(video);
   }else if(video.canPlayType('application/vnd.apple.mpegurl')){
    video.src=it.url;video.play().catch(()=>finish(false));
   }else finish(false);
  }catch(_){finish(false);}
 });
}

function isRemovedVeChannel(it){
 if(!it||it.kind!=='live')return false;
 const isVe=it.countryCode==='ve'||/Venezuela/i.test(String(it.category||''))||/^featured-ve-(?:televen|venevision|meridiano)/.test(String(it.id||''));
 if(!isVe)return false;
 const name=String(it.short||it.title||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();
 return REMOVED_VE_CHANNELS.test(name)||/^featured-ve-(?:televen|venevision|meridiano)/.test(String(it.id||''));
}
function veExperimentalCandidates(country){
 if(country?.[0]!=='ve')return [];
 return VE_PUBLIC_HLS_CANDIDATES.map((x,i)=>({
  id:'official-ve-'+uniqueHash(x.url),
  title:x.name+' · Señal pública en prueba',
  short:x.name,kind:'live',flag:'🇻🇪',genre:x.name==='Meridiano TV'?'Deportes':'General',
  category:'🇻🇪 Venezuela',url:x.url,
  source:'Lista pública experimental · Venezuela',
  countryCode:'ve',direct:true,unverified:true,verifiedManifest:false,
  description:'Fuente HTTPS atribuida al canal en directorios públicos de IPTV. Solo aparece si su manifiesto HLS responde en tu navegador. Su publicación no acredita permiso de integración ni garantiza imagen, sonido o disponibilidad en tu región.'
 }));
}

let activeCountryLoad=null;
let countryLoadSerial=0;
const countryRetryAt=Object.create(null);
async function loadCountry(code,force=false){
 const country=COUNTRIES.find(x=>x[0]===code);
 if(!country)return toast('Selecciona un país válido.');
 const countryName=country[1]+' '+country[2];
 state.category=countryName;
 state.liveShown=100;
 state.liveQuery='';
 // Una selección nueva tiene prioridad absoluta, incluso si hay una prueba en curso.
 if(activeCountryLoad?.code===code&&!force){render();return;}
 if(activeCountryLoad){activeCountryLoad.controller.abort();activeCountryLoad=null;}
 state.loadingCountry=null;
 state.loadProgress='';
 const cached=!force&&state.loadedCountries.includes(code)&&state.worldChannels.some(x=>x.countryCode===code&&x.browserPlayable===true);
 const recentEmpty=!force&&Date.now()-(countryRetryAt[code]||0)<90000;
 if(cached||recentEmpty){render();return;}
 if(force)state.failedStreams=state.failedStreams.filter(id=>!id.startsWith('official-'+code+'-'));
 const controller=new AbortController();
 const token=++countryLoadSerial;
 activeCountryLoad={code,token,controller};
 const active=()=>activeCountryLoad?.token===token&&!controller.signal.aborted;
 state.loadingCountry=code;
 state.loadProgress='Preparando los canales de '+country[2]+'…';
 render();
 // La búsqueda puede continuar en segundo plano, pero la pantalla deja de esperar.
 const shortWait=setTimeout(()=>{
  if(!active())return;
  state.loadingCountry=null;
  state.loadProgress='';
  if(state.view==='live'&&state.category===countryName)render();
 },6500);
 // Ni la lista ni la comprobación de señales podrán quedar pendientes indefinidamente.
 const totalLimit=setTimeout(()=>controller.abort(),65000);
 let fetchLimit=null;
 try{
  const playlistCode=code==='gb'?'uk':code;
  const url=code==='int'?'https://shahrukhalid.github.io/nexonic-iptv/playlists/categories/news.m3u':'https://shahrukhalid.github.io/nexonic-iptv/playlists/countries/'+playlistCode+'.m3u';
  fetchLimit=setTimeout(()=>controller.abort(),9000);
  const response=await fetch(url,{mode:'cors',cache:'no-store',signal:controller.signal});
  if(!response.ok)throw Error('Lista temporalmente no disponible');
  const playlist=await response.text();
  clearTimeout(fetchLimit);fetchLimit=null;
  if(!active())return;
  const candidates=parseCountryPlaylist(playlist,country).concat(veExperimentalCandidates(country));
  const playable=[],checkedPublicNames=new Set();
  for(let i=0;i<candidates.length;i+=4){
   if(!active())return;
   const results=await Promise.all(candidates.slice(i,i+4).map(async item=>({item,ok:await checkBrowserStream(item,controller.signal)})));
   if(!active())return;
   for(const result of results){
    if(!result.ok||state.failedStreams.includes(result.item.id))continue;
    if(result.item.source.startsWith('Lista pública experimental')){
     if(checkedPublicNames.has(result.item.short))continue;
     checkedPublicNames.add(result.item.short);
    }
    playable.push({...result.item,verifiedManifest:true,browserPlayable:true,verifiedPlayback:true,testedAt:Date.now()});
   }
   // Las señales válidas aparecen por lotes; las fallidas no bloquean la interfaz.
   state.worldChannels=state.worldChannels.filter(x=>x.countryCode!==code||!/^(Nexonic|Lista pública experimental)/.test(String(x.source||''))).concat(playable);
   if(state.view==='live'&&state.category===countryName)render();
  }
  if(!active())return;
  if(!state.loadedCountries.includes(code))state.loadedCountries.push(code);
  countryRetryAt[code]=Date.now();
  store();
  if(state.view==='live'&&state.category===countryName)render();
  if(!playable.length)toast('Por ahora no hay emisiones compatibles de '+country[2]+'. Puedes usar los accesos oficiales.');
 }catch(err){
  if(active()){
   countryRetryAt[code]=Date.now();
   if(state.view==='live'&&state.category===countryName)render();
   toast('No fue posible actualizar '+country[2]+'. Intenta de nuevo más tarde.');
  }
 }finally{
  if(fetchLimit!==null)clearTimeout(fetchLimit);
  clearTimeout(shortWait);clearTimeout(totalLimit);
  if(activeCountryLoad?.token===token){
   activeCountryLoad=null;
   state.loadingCountry=null;
   state.loadProgress='';
   if(state.view==='live'&&state.category===countryName)render();
  }
 }
}

function connectYoutubeApiPlayer(){

     try{event.target.playVideo();}catch(_){youtubeStatus('El reproductor no pudo iniciar esta emisión.');}
    },
    onAutoplayBlocked(event){
     if(!youtubeSessionActive(session))return;
     if(session.mutedFallback){

      return;
     }
     session.mutedFallback=true;
     youtubeStatus('▶ El navegador bloqueó el audio automático. Intentando iniciar el canal sin sonido…');
     try{
      const player=event?.target||youtubePlayer;
      player?.mute?.();
      player?.playVideo?.();
      const button=document.getElementById('youtube-unmute');
      if(button)button.hidden=false;
     }catch(_){youtubeStatus('No fue posible comenzar la emisión automática. Prueba desde HTTPS.');}
    },
    onStateChange(event){
     if(!youtubeSessionActive(session))return;
     if(event.data===1){
      const muted=Boolean(event.target?.isMuted?.())||session.mutedFallback;
      youtubeStatus(muted?'▶ Canal reproduciéndose sin sonido. Pulsa «Activar sonido» si deseas escucharlo.':'▶ Transmisión en vivo reproduciéndose automáticamente.');
      const button=document.getElementById('youtube-unmute');
      if(button)button.hidden=!muted;
     }else if(event.data===3){
      youtubeStatus('Cargando la transmisión del canal…');
     }
    },
    onError(event){
     if(!youtubeSessionActive(session))return;
     const code=Number(event?.data||0);
     const detail=code===153?'YouTube no recibió un origen HTTP válido. Publica NÉVIX en HTTPS.':
       [101,150].includes(code)?'El emisor no permite integrar esta señal en otra aplicación.':
       code===100?'La transmisión finalizó o fue retirada.':

     youtubeStatus('No se pudo iniciar el canal. '+detail);

    }

   release();engine='nativo';attempt++;nativeAttempt=true;playing=false;
   status.textContent=it.featuredVenezuela?'Probando fuente '+(sourceIndex+1)+' de '+sourceOptions.length+' en Android…':'Probando motor nativo de Android…';
   try{video.src=url;video.load();tryAutoPlay(video);}catch(e){stopAndReport('No se pudo iniciar el motor nativo.',String(e?.message||e));return;}
   watchdogAfter(11000,'La señal no respondió al motor nativo',()=>stopAndReport('La señal no se pudo reproducir en este dispositivo. Es posible que su URL esté caducada o restringida.','Tiempo de espera motor nativo'));
 };
 const selectJS=(why)=>{
   if(stopped)return;
   if(!hlsSupported){if(nativeSupported&&!nativeAttempt){selectNative(why);return;}stopAndReport('HLS.js no está disponible para esta transmisión.',why);return;}
   release();engine='HLS.js';attempt++;jsAttempt=true;playing=false;
   status.textContent=it.featuredVenezuela?'Conectando fuente '+(sourceIndex+1)+' de '+sourceOptions.length+' mediante HLS.js…':'Conectando con HLS.js…';
   try{
     const hls=new window.Hls({enableWorker:true,lowLatencyMode:false});state.hls=hls;
     hls.on(window.Hls.Events.MANIFEST_PARSED,()=>{if(stopped||state.hls!==hls)return;status.textContent='Formato HLS reconocido; cargando imagen…';tryAutoPlay(video);});
     hls.on(window.Hls.Events.ERROR,(_,data)=>{
       if(stopped||state.hls!==hls||!data?.fatal)return;
       const detail=String(data.type||'error')+' / '+String(data.details||'sin detalle');
       errors.push(detail);
       if(nativeSupported&&!nativeAttempt){selectNative(detail);return;}
       stopAndReport('El proveedor no entregó una señal compatible. Puede ser una URL caducada, un bloqueo CORS o regional.',detail);
     });
     hls.loadSource(url);hls.attachMedia(video);
     watchdogAfter(13000,'Se agotó el tiempo de conexión HLS.js',()=>{errors.push('HLS.js sin respuesta tras 13 s');if(nativeSupported&&!nativeAttempt){selectNative('HLS.js no respondió');return;}stopAndReport('La señal no comenzó a reproducirse. Comprueba el diagnóstico.','Tiempo de espera HLS.js');});
   }catch(e){errors.push(String(e?.message||e));if(nativeSupported&&!nativeAttempt){selectNative('HLS.js no inició');return;}stopAndReport('El reproductor HLS.js no pudo iniciarse.','Error de JavaScript al crear motor');}
 };
 video.addEventListener('playing',()=>{if(stopped)return;playing=true;if(it.verifiedManifest){it.verifiedPlayback=true;}stopTimer();status.textContent=it.id==='nevix-hls-test'?'Prueba HLS reproduciendo. Motor: '+(engine||'video'):(it.sample?'Reproduciendo demostración original':it.kind==='live'?'▶ EN VIVO — motor '+(engine||'video'):'Reproduciendo video');if(details)details.hidden=true;});
 video.addEventListener('error',()=>{
   if(stopped)return;
   const detail='video.error '+String(video.error?.code||'desconocido');
   if(isHLS&&engine==='nativo'){errors.push(detail);stopAndReport('El motor nativo no pudo abrir esta señal. El canal puede requerir su reproductor oficial.',detail);}
   else if(!isHLS)stopAndReport('El video no se pudo descargar o decodificar.',detail);
 });
 video.addEventListener('loadedmetadata',()=>{const last=state.progress[it.id]?.time||0;if(it.kind!=='live'&&last>1&&Number.isFinite(video.duration)&&last<video.duration-2)video.currentTime=last;});
 video.addEventListener('timeupdate',()=>{if(it.kind==='live'||!Number.isFinite(video.duration)||!video.duration)return;let now=Date.now();if(now-state.lastSave<4000)return;state.lastSave=now;state.progress[it.id]={time:Math.floor(video.currentTime),duration:Math.floor(video.duration)};store();});
 video.addEventListener('ended',()=>{if(it.kind!=='live'){delete state.progress[it.id];store();}if(it.kind==='series'){const episodes=allItems().filter(x=>x.kind==='series'&&(x.seriesName||x.title)===(it.seriesName||it.title)).sort((a,b)=>(a.season-b.season)||(a.episode-b.episode));let n=episodes.findIndex(x=>x.id===it.id);if(n>=0&&episodes[n+1])status.textContent='Episodio terminado. El siguiente: '+episodes[n+1].title;}});
 currentLiveEngine={cancel:()=>{stopped=true;stopTimer();},switchEngine:()=>{
   if(!isHLS)return toast('El video no es una señal HLS.');
   if(engine==='HLS.js'){if(nativeSupported)selectNative('Cambio manual de motor');else issue('El navegador no ofrece un segundo motor HLS en este dispositivo.');}
   else if(hlsSupported)selectJS('Cambio manual de motor');
   else issue('HLS.js no está disponible para este navegador.');
 }};
 if(isHLS){if(hlsSupported)selectJS('Inicio');else if(nativeSupported)selectNative('HLS.js no disponible');else stopAndReport('Este navegador no soporta reproducción HLS.','No hay motores HLS');}
 else{engine='video HTML5';video.src=url;tryAutoPlay(video);}
 $('#player-root .player-close')?.focus();
}
function tryAutoPlay(video){
 const attempt=video.play();
 if(attempt?.catch)attempt.catch(async()=>{
  const st=$('#player-status');
  if(video.id==='nevix-player'&&state.playing==='featured-ve-globovision'){
   video.muted=true;
   try{
    await video.play();
    const button=$('#player-unmute');if(button)button.hidden=false;
    if(st)st.textContent='▶ Reproducción automática sin sonido. Pulsa «Activar sonido» para escucharlo.';
    return;
   }catch(_){/* El navegador o el servidor no permite el intento silencioso. */}
  }
  if(st)st.textContent='No se pudo comenzar automáticamente esta señal. Comprueba las fuentes del canal.';
 });
}
function closePlayer(){const it=itemById(state.playing);const video=$('#nevix-player');if(it&&video&&it.kind!=='live'&&Number.isFinite(video.duration)&&video.duration){state.progress[it.id]={time:Math.floor(video.currentTime),duration:Math.floor(video.duration)};store();}disposePlayer();render();}
function toggleFavorite(id){if(!itemById(id))return;const n=state.favorites.indexOf(id);if(n>=0)state.favorites.splice(n,1);else state.favorites.push(id);store();if(state.selected){openDetail(state.selected);}else render();toast(n>=0?'Quitado de Mi lista':'Añadido a Mi lista');}
function deleteItem(id){const it=itemById(id);if(!it||!confirm(`¿Eliminar "${it.title}" de tu catálogo? No borrará el video original.`))return;state.items=state.items.filter(x=>x.id!==id);state.sessionItems=state.sessionItems.filter(x=>x.id!==id);state.favorites=state.favorites.filter(x=>x!==id);delete state.progress[id];store();render();toast('Contenido eliminado.');}
async function hashPin(pin){const encoded=new TextEncoder().encode('NEVIX-PIN-LOCAL:'+pin);const buffer=await crypto.subtle.digest('SHA-256',encoded);return Array.from(new Uint8Array(buffer)).map(x=>x.toString(16).padStart(2,'0')).join('');}
async function setPin(){let pin=prompt('Elige un PIN numérico de 4 a 12 dígitos para este dispositivo:');if(pin===null)return;if(!/^\d{4,12}$/.test(pin))return toast('El PIN debe tener entre 4 y 12 números.');let confirmation=prompt('Repite tu nuevo PIN:');if(pin!==confirmation)return toast('Los PIN no coinciden.');try{state.pinHash=await hashPin(pin);state.unlocked=true;store();render();toast('PIN local configurado.');}catch(e){toast('No se puede configurar el PIN en este contexto. Usa HTTPS.');}}
async function unlockPin(pin){if(!/^\d{4,12}$/.test(pin))return toast('PIN incorrecto.');if(await hashPin(pin)===state.pinHash){state.unlocked=true;render();toast('Panel desbloqueado.');}else toast('PIN incorrecto.');}
function downloadJSON(){const payload={format:'NEVIX-TV-V1',date:new Date().toISOString(),items:state.items.filter(x=>!x.sample),favorites:state.favorites,progress:state.progress};const href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=href;a.download='NEVIX_TV_Respaldo.json';a.click();setTimeout(()=>URL.revokeObjectURL(href),2000);toast('Respaldo generado. Los videos no se incluyen.');}
function importM3uText(text){try{let records=parseM3U(text);if(!records.length)return toast('No encontramos enlaces válidos en la lista M3U.');const available=Math.max(0,2000-state.items.length);records=records.slice(0,available);if(!records.length)return toast('Límite de 2.000 entradas alcanzado.');state.items.push(...records);store();render();toast(`${records.length} canal(es) importados. Su reproducción depende de la fuente y permisos.`);}catch(e){toast(e.message||'La lista M3U no se pudo leer.');}}
function readFile(file,done){if(!file)return;if(file.size>2_000_000){toast('Archivo demasiado grande (máximo 2 MB).');return;}const reader=new FileReader();reader.onload=()=>done(String(reader.result||''));reader.onerror=()=>toast('No se pudo leer el archivo.');reader.readAsText(file);}
function importJSON(text){try{const data=JSON.parse(text);if(data.format!=='NEVIX-TV-V1'||!Array.isArray(data.items))throw Error('Formato incorrecto.');const verified=data.items.slice(0,2000).map(x=>normalizeItem({...x,sample:false},{allowDemo:false})).filter(Boolean);if(!confirm(`¿Importar ${verified.length} entrada(s)? Esto sustituirá tu catálogo actual y tus favoritos.`))return;state.items=verified;state.favorites=Array.isArray(data.favorites)?data.favorites.map(String).filter(id=>verified.some(it=>it.id===id)):[];state.progress={};store();render();toast(`${verified.length} entrada(s) restauradas.`);}catch(e){toast('El archivo JSON no tiene un formato de respaldo válido.');}}
function addItem(form){const fd=new FormData(form);let kind=String(fd.get('kind')||'live');const raw={kind,title:String(fd.get('title')||''),url:String(fd.get('url')||''),category:String(fd.get('category')||'')||'General',image:String(fd.get('image')||''),year:String(fd.get('year')||''),description:String(fd.get('description')||''),seriesName:String(fd.get('seriesName')||'')};
 const epcode=String(fd.get('episodeCode')||'').split('/');raw.season=Number(epcode[0])||1;raw.episode=Number(epcode[1])||1;
 if(kind==='series'&&!raw.seriesName.trim())return toast('Para un episodio, indica el nombre de la serie.');
 const item=normalizeItem(raw);if(!item)return toast('Revisa el nombre y la dirección HTTP(S) del contenido.');
 if(item.url.startsWith('http:')&&location.protocol==='https:')return toast('Usa un enlace HTTPS: los HTTP se bloquean en páginas seguras.');
 if(raw.image&&!item.image)return toast('La portada debe usar una URL HTTPS válida.');
 if(state.items.length>=2000)return toast('Límite de 2.000 entradas alcanzado.');state.items.push(item);store();form.reset();render();toast('Contenido guardado. Ahora puedes reproducirlo desde su sección.');}
function resetApp(){if(!confirm('¿Restaurar los datos de demostración? Se perderán los enlaces, favoritos y avances guardados.'))return;state.items=structuredClone(SAMPLES);state.worldChannels=[];state.loadedCountries=[];state.favorites=[];state.progress={};state.selectedChannel='direct-ve-canali';state.pinHash='';state.unlocked=false;store();render();toast('NÉVIX TV restaurado.');}

document.addEventListener('click',async e=>{const target=e.target.closest('[data-action]');if(!target)return;const a=target.dataset.action;const id=target.dataset.id;
 switch(a){case 'nav':go(target.dataset.view);break;case 'go-search':go('search');break;case 'toggle-menu':$('#sidebar').classList.toggle('open');break;case 'filter':state.category=target.dataset.category;render();break;case 'load-country':loadCountry($('#country-select')?.value||'ve',true);break;case 'quick-country':loadCountry(target.dataset.code);break;case 'reset-country-filter':state.category='Todos';state.liveShown=100;render();break;case 'show-more-live':state.liveShown+=100;render();break;case 'select-channel':state.selectedChannel=id;render();play(id);break;case 'retry-stream':play(id);break;case 'unmute-youtube':unmuteYoutube();break;case 'unmute-player':{const video=$('#nevix-player');if(video){video.muted=false;video.play().catch(()=>{video.muted=true;toast('El navegador bloqueó el audio automático. Usa el volumen del reproductor.');});const button=$('#player-unmute');if(button)button.hidden=true;}break;}case 'switch-stream-engine':switchStreamEngine();break;case 'test-hls':play('nevix-hls-test');break;case 'show-player-diagnostics':{const d=$('#player-details');if(d){if(!d.textContent){const v=$('#nevix-player');d.textContent='Origen: '+location.protocol+' · HLS.js: '+(window.Hls?.isSupported?.()?'disponible':window.Hls?'no compatible':'no cargado')+' · HLS nativo: '+(v?.canPlayType('application/vnd.apple.mpegurl')||'no')+' · Red: '+(navigator.onLine?'en línea':'sin conexión')+' · La fuente y sus permisos deben verificarse por separado.';}d.hidden=!d.hidden;}break;}case 'detail':openDetail(id);break;case 'close-detail':closeDetail();break;case 'close-player':closePlayer();break;case 'toggle-player-fullscreen':togglePlayerFullscreen();break;case 'play':play(id);break;case 'favorite':toggleFavorite(id);break;case 'delete':deleteItem(id);break;case 'import-m3u':importM3uText($('#m3u-text')?.value||'');break;case 'export-json':downloadJSON();break;case 'set-pin':await setPin();break;case 'remove-pin':if(confirm('¿Quitar protección PIN en este dispositivo?')){state.pinHash='';store();render();}break;case 'lock':state.unlocked=false;render();break;case 'reset':resetApp();break;}
});
document.addEventListener('submit',async e=>{if(e.target.id==='add-form'){e.preventDefault();addItem(e.target);}else if(e.target.id==='unlock-form'){e.preventDefault();try{await unlockPin(String(new FormData(e.target).get('pin')||''));}catch{toast('No se pudo verificar el PIN. Usa HTTPS.');}}});
document.addEventListener('change',e=>{if(e.target.id==='country-select'){const c=COUNTRIES.find(x=>x[0]===e.target.value);if(c){loadCountry(c[0]);}}if(e.target.id==='live-direct-toggle'){state.showOnlyPlayable=e.target.checked;state.liveShown=100;render();}if(e.target.id==='m3u-file'){readFile(e.target.files?.[0],importM3uText);e.target.value='';}if(e.target.id==='json-file'){readFile(e.target.files?.[0],importJSON);e.target.value='';}});
document.addEventListener('input',e=>{if(e.target.id==='live-search'){const pos=e.target.selectionStart;state.liveQuery=e.target.value;state.liveShown=100;render();const inp=$('#live-search');inp?.focus();try{inp?.setSelectionRange(pos,pos);}catch(_){}}if(e.target.id==='movie-search'){const pos=e.target.selectionStart;state.movieQuery=e.target.value;render();const inp=$('#movie-search');inp?.focus();try{inp?.setSelectionRange(pos,pos);}catch(_){}}if(e.target.id==='global-search'){const pos=e.target.selectionStart;state.search=e.target.value;const grid=$('#main .tile-grid');const result=chooseItems(allItems(),{q:state.search});const heading=$('#main .section-head h2');if(heading)heading.textContent=state.search?`${result.length} resultado(s)`:'Todo el contenido';if(grid)grid.innerHTML=seriesOnce(result.filter(x=>x.kind==='series')).concat(result.filter(x=>x.kind!=='series')).map(x=>card(x,true)).join('');else if(result.length){render({focusSearch:true});const inp=$('#global-search');inp?.setSelectionRange(pos,pos);}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='Backspace'&&e.target.tagName!=='INPUT'&&e.target.tagName!=='TEXTAREA'){if(els.player.innerHTML){const s=document.querySelector('#player-root .player-shell');if(s&&(s.classList.contains('nevix-expanded')||document.fullscreenElement===s||document.webkitFullscreenElement===s)){e.preventDefault();exitPlayerFullscreen();return;}closePlayer();return;}if(els.modal.innerHTML){closeDetail();return;}$('#sidebar').classList.remove('open');}if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key) && !['INPUT','TEXTAREA','SELECT','VIDEO'].includes(document.activeElement?.tagName)&&!els.player.innerHTML){const focusables=[...document.querySelectorAll('button:not(:disabled),a[href]')].filter(el=>el.getBoundingClientRect().width>0);if(focusables.length){let i=focusables.indexOf(document.activeElement);if(i<0)return;let step=(e.key==='ArrowRight'||e.key==='ArrowDown')?1:-1;let next=focusables[(i+step+focusables.length)%focusables.length];if(next){e.preventDefault();next.focus({preventScroll:false});}}}});
window.addEventListener('hashchange',()=>{const requested=location.hash.slice(1);if(requested==='netflix'){go('movie');return;}if(NAMES[requested]&&requested!==state.view){state.view=requested;state.category='Todos';state.search='';render();}});
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
if(!saved){try{localStorage.setItem(DB,JSON.stringify({items:state.items,favorites:state.favorites,progress:state.progress,pinHash:state.pinHash,worldChannels:state.worldChannels.slice(0,1800),loadedCountries:state.loadedCountries}));}catch(_){}}const initial=location.hash.slice(1);state.view=initial==='netflix'?'movie':NAMES[initial]?initial:'inicio';if(initial==='netflix')location.hash='movie';render();


</script>
